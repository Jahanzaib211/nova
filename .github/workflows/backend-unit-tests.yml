name: Unit Tests

on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        # `postgres` extra: tests that pin the LangGraph checkpoint schema import
        # langgraph.checkpoint.postgres (local-ci.yml installs it too).
        run: uv sync --group dev --extra postgres

      - name: Provide config.yaml (per-repo setup, never committed)
        run: cp config.example.yaml config.yaml

      - name: Run unit tests of backend
        working-directory: backend
        run: make test
