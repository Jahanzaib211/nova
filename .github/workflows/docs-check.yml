name: Documentation Check

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**/*.md'
      - 'backend/*.md'
      - 'frontend/*.md'
      - '.github/workflows/docs-check.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '*.md'
      - 'docs/**/*.md'
      - 'backend/*.md'
      - 'frontend/*.md'
      - '.github/workflows/docs-check.yml'

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.43.0

      - name: Lint markdown files
        run: |
          markdownlint \
            --config .markdownlint.jsonc \
            --ignore ".git/**" \
            --ignore "node_modules/**" \
            --ignore "frontend/node_modules/**" \
            --ignore ".deer-flow/**" \
            --ignore ".next/**" \
            --ignore "backend/.venv/**" \
            --ignore "skills/**" \
            --ignore "frontend/public/demo/**" \
            --ignore "frontend/test-results/**" \
            --ignore "frontend/playwright-report/**" \
            "**/*.md"

      - name: Check for broken internal links
        run: |
          # Simple internal link checker for markdown files
          # Looks for [text](./path) or [text](../path) style links and verifies the target exists
          #
          # Scope is `git ls-files`, not `find`: the previous filter listed a few
          # known directories by name, which missed *nested* node_modules and the
          # real agent-data path (backend/.deer-flow, not ./.deer-flow). Locally
          # that buried the signal under hundreds of broken links from vendored
          # package READMEs. Only tracked docs are ours to keep valid anyway.
          git ls-files '*.md' | while read file; do
            dir=$(dirname "$file")
            grep -oP '\[.*?\]\(\K\./[^)]+|\[.*?\]\(\K\.\./[^)]+' "$file" | while read link; do
              # Resolve relative path
              target=$(realpath -m "$dir/$link" 2>/dev/null || echo "")
              if [ -n "$target" ] && [ ! -e "$target" ] && [ ! -e "${target}.md" ]; then
                echo "::warning file=$file::Broken internal link: $link -> $target"
              fi
            done
          done

      - name: Verify NOVA_CHANGELOG.md Status section is current
        run: |
          # Check that NOVA_CHANGELOG.md has a "Current Platform Status" table
          if ! grep -q "Current Platform Status" NOVA_CHANGELOG.md; then
            echo "::error::NOVA_CHANGELOG.md missing 'Current Platform Status' section"
            exit 1
          fi
          
          # Check that phase statuses are marked with emoji
          if ! grep -q "✅\|🔄\|⏳" NOVA_CHANGELOG.md; then
            echo "::warning::NOVA_CHANGELOG.md phase statuses should use ✅/🔄/⏳ emoji"
          fi

      - name: Verify OPEN_CORE.md exists
        run: |
          if [ ! -f OPEN_CORE.md ]; then
            echo "::error::OPEN_CORE.md not found at repo root"
            exit 1
          fi

      - name: Verify LICENSE + NOTICE.md pair
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE not found at repo root"
            exit 1
          fi
          if [ ! -f NOTICE.md ]; then
            echo "::error::NOTICE.md not found at repo root"
            exit 1
          fi
          # Verify NOTICE.md mentions proprietary additions
          if ! grep -q "proprietary" NOTICE.md; then
            echo "::warning::NOTICE.md should mention proprietary additions"
          fi