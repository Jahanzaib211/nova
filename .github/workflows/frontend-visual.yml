name: Frontend Visual Snapshots

# Renders the visual-regression screens (frontend/tests/e2e/visual) inside
# the Playwright container so fonts and GL are deterministic, and uploads the
# result as an artifact.
#
# Non-blocking for now: the committed snapshots were rendered on the
# developer box (Ubuntu 26.04 fonts), so an in-container compare would be red
# on day one. Flip `--update-snapshots=all` to a plain compare (and drop
# `continue-on-error`) once a container-rendered set has been committed with
# `vr: update snapshots (container baseline)`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-visual.yml'
  workflow_dispatch:

concurrency:
  group: frontend-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Must match frontend's @playwright/test: each release looks for its own
      # browser build (chromium-1248 for 1.64.1) and the image only ships one.
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # npm, not corepack: the Playwright 1.64 image's Node ships without
      # corepack, so `corepack enable` exits 127 there.
      - name: Install pnpm
        run: npm install -g pnpm@10.26.2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Render visual snapshots
        working-directory: frontend
        run: pnpm exec playwright test tests/e2e/visual --project=chromium --project=mobile-chrome --update-snapshots=all --workers=1
        env:
          SKIP_ENV_VALIDATION: '1'
          NOVA_VISUAL: '1'
          HOME: /root

      - name: Upload rendered snapshots
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: visual-snapshots
          path: frontend/tests/e2e/visual/__snapshots__/
          retention-days: 14
