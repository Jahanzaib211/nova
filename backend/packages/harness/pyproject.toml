[project]
name = "deerflow-harness"
version = "2.1.0"
description = "DeerFlow agent harness framework"
requires-python = ">=3.12"
dependencies = [
    # Declared explicitly, not left transitive. The gateway's WebSocket bridges
    # (app/gateway/routers/sandbox.py, routers/voice.py) run on it, and an
    # unconstrained langchain-family lock resolution silently pulled it
    # *backwards* with nothing to notice. A floor pin turns any future
    # regression into a resolver error instead of a surprise.
    #
    # The ceiling is upstream, not a preference: langchain 1.3.9 — the release
    # that fixes PYSEC-2026-2192 — requires websockets<16, so ">=16" and a
    # vulnerability-free langchain are mutually unsatisfiable today. We take the
    # security fix; 15.0.1 carries every API these bridges use (verified:
    # connect(open_timeout=, max_size=, ping_interval=)).
    "websockets>=15.0.1,<16",
    "agent-client-protocol>=0.4.0",
    "agent-sandbox>=0.0.19",
    "dotenv>=0.9.9",
    "exa-py>=1.0.0",
    "httpx>=0.28.0",
    "kubernetes>=30.0.0",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=3.4.1",
    "langgraph>=1.1.9",
    "langgraph-api>=0.8.1",
    "langgraph-cli>=0.4.24",
    "langgraph-runtime-inmem>=0.28.0",
    "markdownify>=1.2.2",
    "markitdown[all,xlsx]>=0.0.1a2",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "readabilipy>=0.3.0",
    "tavily-python>=0.7.17",
    "firecrawl-py>=1.15.0",
    "tiktoken>=0.8.0",
    "ddgs>=9.10.0",
    "duckdb>=1.4.4",
    "langchain-google-genai>=4.2.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-sdk>=0.1.51",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "cryptography>=43.0.0",
    "playwright>=1.40.0",
    "httpx-socks>=0.11.0",
]

[project.optional-dependencies]
# Self-hosted voice. Everything here runs on onnxruntime — deliberately no
# PyTorch, which is what keeps the gateway image and its memory footprint small.
# Weights are fetched separately by scripts/fetch-voice-models.sh.
voice = [
    "faster-whisper>=1.1.0",   # Whisper on CTranslate2 — ~4x faster, far leaner
    "kokoro-onnx>=0.4.0",      # Kokoro-82M TTS, Apache-2.0, ONNX (no torch)
    "onnxruntime>=1.20.0",     # shared by Kokoro and Silero VAD
    "numpy>=1.26.0",
]
# GPU voice. Install *instead of* `voice`, not alongside it: `onnxruntime` and
# `onnxruntime-gpu` both provide the `onnxruntime` module and having both
# installed is unpredictable.
#
# The nvidia-*-cu12 wheels are for CTranslate2, not onnxruntime: it links
# `libcublas.so.12` while a modern host may ship CUDA 13, so these supply the
# CUDA 12 runtime it expects. `deerflow.speech.devices.preload_cuda_libraries()`
# makes them loadable without `LD_LIBRARY_PATH`.
#
# Measured on an RTX 3060: Whisper RTF 0.632 -> 0.021, Kokoro first-audio
# 510 ms -> 200 ms (with fp32 weights; the int8 build is slower on both devices).
voice-gpu = [
    "faster-whisper>=1.1.0",
    "kokoro-onnx>=0.4.0",
    "onnxruntime-gpu>=1.21.0", # >=1.21 is where preload_dlls() appears
    "numpy>=1.26.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

ollama = ["langchain-ollama>=0.3.0"]
postgres = [
    "asyncpg>=0.29",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]
pymupdf = ["pymupdf4llm>=0.0.17"]
redis = ["redis[hiredis]>=5.0.0"]
# Market data sources for the `trading` tool group. Optional because
# yfinance pulls pandas + numpy into every install; the indicators
# themselves are pure Python and need nothing.
trading = [
    "ccxt>=4.4.0",
    "yfinance>=0.2.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `nova` is the package identity; `deerflow` is the implementation it currently
# aliases. Both ship so either import path resolves to the same modules — see
# nova/__init__.py for why the rename is being done in two halves.
packages = ["deerflow", "nova"]
