# Nova Development Environment
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: Reverse proxy (port 2026)
#   - frontend: Frontend Next.js dev server (port 3000)
#   - gateway: Backend Gateway API + agent runtime (port 8001)
#   - provisioner (optional): Sandbox provisioner (creates Pods in host Kubernetes)
#
# Prerequisites:
#   - Kubernetes cluster + kubeconfig are only required when using provisioner mode.
#
# Access: http://localhost:2026

services:
  # ── Sandbox Provisioner ────────────────────────────────────────────────
  # Manages per-sandbox Pod + Service lifecycle in the host Kubernetes
  # cluster via the K8s API.
  # Backend accesses sandboxes directly via host.docker.internal:{NodePort}.
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      # Host paths for K8s HostPath volumes (must be absolute paths accessible by K8s node)
      # On Docker Desktop/OrbStack, use your actual host paths like /Users/username/...
      # Set these in your shell before running docker-compose:
      #   export DEER_FLOW_ROOT=/absolute/path/to/deer-flow
      - SKILLS_HOST_PATH=${DEER_FLOW_ROOT}/skills
      - THREADS_HOST_PATH=${DEER_FLOW_ROOT}/backend/.deer-flow/threads
      # Production: use PVC instead of hostPath to avoid data loss on node failure.
      # When set, hostPath vars above are ignored for the corresponding volume.
      # USERDATA_PVC_NAME uses subPath (deer-flow/users/{user_id}/threads/{thread_id}/user-data) automatically.
      # - SKILLS_PVC_NAME=deer-flow-skills-pvc
      # - USERDATA_PVC_NAME=deer-flow-userdata-pvc
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      # Override K8S API server URL since kubeconfig uses 127.0.0.1
      # which is unreachable from inside the container
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  # Routes API traffic to gateway and (optionally) provisioner.
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "127.0.0.1:2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      # Durable visitor log store (survives container recreation). nginx
      # writes access.jsonl here; scripts/nova-visitors.py reads/prunes it.
      - ../logs/nova:/var/log/nova
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      deer-flow-dev:
        ipv4_address: 192.168.200.2
    restart: unless-stopped
    # Audit P1: the proxy is the single public entrypoint — bound memory (the
    # exit-137 incident was an unbounded container) and a liveness probe so
    # `docker ps` shows red before users see a dead site.
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2026/api/v1/auth/setup-status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Hardening parity with docker-compose.yaml's nginx service: drop all
    # capabilities, add back only what nginx's master/worker model needs
    # (NET_BIND_SERVICE for the listen port, CHOWN/SETUID/SETGID/DAC_OVERRIDE
    # for the master process to spawn workers as the unprivileged nginx user).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 256

  # Frontend - Next.js Development Server
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    command: sh -c "cd frontend && pnpm run dev >> /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # Mount pnpm store for caching
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      # Use the gateway's direct bridge IP rather than the docker DNS
      # service name. SSR fetches from inside this container can fail to
      # resolve 'gateway' after a container recreation (Docker's internal
      # DNS at 127.0.0.11 returns SERVFAIL until the network is fully
      # rebuilt). The bridge IP is stable for the lifetime of the network
      # and matches the value pinned in nginx.conf (Batch 2A). For
      # production deployments behind a real LB, override via .env.
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://192.168.200.3:8001
      # Heap ceiling *below* mem_limit (4 GiB). Without this Node grows until
      # the kernel OOM-kills it — abrupt, nothing in the log, and an nginx 502
      # for whoever is using the app. With it, V8 collects harder as it nears
      # the limit and the process stays alive. 3 GiB leaves room for the
      # non-heap side (Turbopack's native allocations, buffers, the runtime).
      - NODE_OPTIONS=--max-old-space-size=3072
      # Match the gateway: dev mode skips the sign-in gate so the user
      # can interact with the app immediately. Production must set
      # DEER_FLOW_AUTH_DISABLED=0 (or DEER_FLOW_ENV=prod).
      - DEER_FLOW_AUTH_DISABLED=${DEER_FLOW_AUTH_DISABLED:-1}
    env_file:
      - ../frontend/.env
    networks:
      deer-flow-dev:
        ipv4_address: 192.168.200.4
    restart: unless-stopped
    # Hardening parity with docker-compose.yaml's frontend service (prod
    # target runs as USER node already; no cap_add needed).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    pids_limit: 512
    # Cap the Next server. Learned from a real incident on 2026-08-01: this
    # container had no limit, next-server leaked to 13.9 GiB over ~18h uptime,
    # the host burned through 7.5 GiB of 8 GiB swap, and the kernel OOM-killer
    # took out unrelated desktop processes. With a limit, Docker kills and
    # restarts only this container (restart: unless-stopped above) instead of
    # letting one leak destabilise the whole machine. The Helm chart already
    # capped frontend at 512Mi — this brings compose to parity, with headroom
    # because the compose build runs `next start` from a fuller image.
    # 4 GiB, not 2. Next 16 dev with Turbopack holds the whole module graph,
    # source maps and HMR history resident, and that set grows with every
    # recompile rather than shrinking back. Measured at 1.98 GiB against the old
    # 2 GiB cap, which OOM-killed the container 155 times — each kill shows up
    # as an nginx 502 because the upstream simply vanishes. The host has 30 GiB,
    # so this is still a small share.
    # 2026-08-15 bump: 4g was tripped overnight (2026-08-15 07:00 PKT, exit 137)
    # after a long HMR session accumulated. 6g keeps the container healthy
    # through sustained edit cycles without giving it free rein to take the
    # host down.
    mem_limit: 6g

  # Backend - Gateway API
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: deer-flow-gateway
    # Pin the IP so downstream services (nginx, frontend SSR) can pin to a
    # stable address across container restarts. Without this, Docker's
    # internal DNS at 127.0.0.11 occasionally returns SERVFAIL for the
    # service name 'gateway' after a network restart, and the assigned
    # bridge IP changes with each container recreation (Batch 2B.5/3).
    networks:
      deer-flow-dev:
        ipv4_address: 192.168.200.3
    # Startup logic lives in docker/dev-entrypoint.sh — UV_EXTRAS validation,
    # `uv sync --all-packages`, .venv self-heal, and uvicorn handoff. Keeps
    # this file readable and lets the script be linted (shellcheck-clean).
    # See PR #2767 / Issue #2754.
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    # Detect a hung-but-"Up" gateway (the failure mode behind the 2026-07-16
    # outage: uvicorn dead, container still Up, nginx upstream timing out).
    # Uses the in-image python (no curl/wget in this container). start_period
    # covers the slow cold boot; autoheal label lets a sidecar restart it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 150s
    labels:
      - autoheal=true
    volumes:
      # Mount the dev entrypoint as a read-only file so edits to the script
      # take effect on `make docker-restart` without requiring an image rebuild.
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ../backend/:/app/backend/
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      # Use a Docker-managed uv cache volume instead of a host bind mount.
      # On macOS/Docker Desktop, uv may fail to create symlinks inside shared
      # host directories, which causes startup-time `uv sync` to crash.
      - gateway-uv-cache:/root/.cache/uv
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/docker.sh). See backend/docs/CONFIGURATION.md 
      
      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).

      # Voice model weights are NOT mounted by default: the base compose file
      # must work on hosts that have not fetched them (see the header on
      # docker-compose.voice.yaml). When `speech.enabled: true` and the
      # weights exist on the host under DEERFLOW_VOICE_MODEL_DIR, the canonical
      # entry point — `./scripts/docker.sh start` (a.k.a. `make docker-start`)
      # — appends docker-compose.voice.yaml as an overlay. That overlay bind-
      # mounts the host directory to /app/voice-models and rewrites the in-
      # container DEERFLOW_*_PATH env vars to point there; `environment:`
      # wins over `env_file:`, which is what makes the host paths in ../.env
      # harmless inside the container.
      #
      # Bypassing scripts/docker.sh (e.g. by running `docker compose -f
      # docker-compose-dev.yaml up -d --force-recreate gateway` directly to
      # recover from a broken container) silently drops the voice overlay.
      # The Python deps stay installed (`uv sync --extra voice` still runs),
      # so both engines report as loaded — but the ONNX session build then
      # fails with "Voices file not found at /home/<host-user>/.cache/..."
      # because that path does not exist inside the container. Use the
      # canonical command instead, or include the voice overlay explicitly:
      #
      #   docker compose -p deer-flow-dev \
      #     -f docker/docker-compose-dev.yaml \
      #     -f docker/docker-compose.voice.yaml \
      #     up -d --force-recreate --no-deps gateway
    working_dir: /app
    environment:
      - CI=true
      # Batch 3 final: enable auth-disabled mode by default in dev so the
      # user can immediately interact with the app without setting up an
      # admin password. Production deployments must set DEER_FLOW_ENV=prod
      # (or DEER_FLOW_AUTH_DISABLED=0) — the gateway refuses to start with
      # auth disabled in an explicit production environment.
      - DEER_FLOW_AUTH_DISABLED=${DEER_FLOW_AUTH_DISABLED:-1}
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      # These two MUST be pinned here. ../.env carries HOST paths — it has to,
      # because docker-compose.yaml uses ${DEER_FLOW_CONFIG_PATH} as the *source*
      # of a bind mount — and env_file would otherwise leak them into the
      # container, where they do not exist. The gateway then dies at import with
      # FileNotFoundError from AppConfig.resolve_config_path(), uvicorn never
      # binds 8001, and nginx reports "gateway could not be resolved" (Docker DNS
      # SERVFAILs the name of a down container). Cost a full outage on 2026-08-17.
      # Mirrors docker-compose.yaml:138-139 — but note the dev mounts land at
      # /app/..., not /app/backend/... like prod.
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Hardening parity with docker-compose.yaml's gateway service, MINUS
    # cap_drop: the `dev` build target (used here) has no USER directive and
    # runs as root, unlike docker-compose.yaml's stage which drops to `app`.
    # cap_drop: ALL on a root process strips CAP_DAC_OVERRIDE, which broke
    # SQLite WAL access ("attempt to write a readonly database") the moment
    # this was tried — root without DAC_OVERRIDE is bound by normal file
    # permission bits like any other user. no-new-privileges alone is still
    # real, zero-risk hardening (blocks setuid-binary privilege escalation
    # from agent-directed bash commands via LocalSandboxProvider) and needs
    # no capability grant. read_only is NOT set — this container writes
    # runtime state to backend/.deer-flow via a live bind mount.
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    # Same rationale as the frontend cap above — no service on this host
    # should be able to exhaust 30 GiB unbounded. Sized well above the Helm
    # chart's 1536Mi because the dev gateway also carries uv's build cache,
    # Playwright, and in-process agent runs that the chart's pods do not.
    mem_limit: 6g

  # ── SearXNG (Privacy Search Engine) ──────────────────────────────────
  # v7.2 Batch 2A: bound to loopback so LAN/internet cannot reach SearXNG
  # directly; only the gateway container (on the same docker network) can
  # reach it via the service name. Operators on the host use SSH tunnel
  # (`ssh -L 8088:localhost:8088 host`) if they need direct access.
  searxng:
    image: searxng/searxng:latest
    container_name: deer-flow-searxng
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?Set SEARXNG_SECRET_KEY in .env}
      - SEARXNG_BASE_URL=http://searxng:8080
    networks:
      - deer-flow-dev
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    restart: unless-stopped

  # TOR proxy removed: it crash-looped under the non-root hardening (setgid
  # EPERM) and is not needed for the default stack. Re-add a hardened Tor
  # service here if iGIN0 anonymized fetching is required.

  # Autoheal: restarts any container marked `autoheal=true` (currently the
  # gateway) when its Docker healthcheck reports unhealthy. This is the
  # missing auto-recovery from the 2026-07-16 outage — a hung-but-Up gateway
  # now self-heals within ~15s instead of taking the site down until a human
  # notices. Watches the Docker socket read-only-ish (needs it to issue the
  # restart); no ports, minimal footprint.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: deer-flow-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=60
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  # Persist .venv across container restarts so dependencies installed during
  # image build are not shadowed by the host backend/ directory mount.
  gateway-venv:
  gateway-uv-cache:

networks:
  deer-flow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
