# Nova — CLI auth overlay (OPT-IN, NOT loaded by default)
#
# Bind-mounts the host Claude Code / Codex CLI config dirs into the gateway so:
#   - ClaudeChatModel / Codex model providers can reuse the CLI subscription
#     login (~/.claude/.credentials.json, ~/.codex/auth.json), and
#   - ACP agents (acp_agents in config.yaml) that run the claude/codex CLI
#     inside the container can read their config.
#
# SECURITY: these mounts expose the ENTIRE ~/.claude and ~/.codex dirs
# (conversation history, projects, global config, long-lived credentials) into
# the gateway container, read-only. A gateway compromise leaks all of it. That
# is why they are NOT mounted by default.
#
# Prefer passing only a token via env instead (no directory exposure):
#   CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_AUTH_TOKEN for Claude, CODEX_AUTH_PATH
#   for a single Codex auth file — see .env.example and SECURITY.md.
# Use this overlay only when you need the full CLI config (e.g. ACP adapters
# that run the CLI in-container and read more than just the credential file).
#
# Manual use (works with both prod and dev compose):
#   docker compose -f docker-compose.yaml -f docker-compose.cli-auth.yaml up -d
services:
  gateway:
    volumes:
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
      # Claude Code keeps account/onboarding state beside the directory, in
      # ~/.claude.json; without it the CLI reports "configuration file not
      # found" and never authenticates. It is NOT bind-mounted as a single
      # file: the CLI rewrites it by write-then-rename, and a single-file bind
      # keeps serving the inode from container creation, so the container read
      # an ever older copy (drift gate: file_mounts yellow). scripts/acp-
      # secrets.sh stages it into this directory on every launcher start; a
      # directory mount resolves names on each lookup, so a re-stage is live
      # without recreating anything. /root/.claude.json is a symlink to
      # NOVA_CLAUDE_STATE_FILE (dev-entrypoint.sh / the jobs command below).
      # Same read-only contract.
      - type: bind
        source: ${NOVA_CLAUDE_STATE_DIR:-${HOME:?HOME must be set}/.nova/claude-state}
        target: /run/nova/claude-state
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    environment:
      - NOVA_CLAUDE_STATE_FILE=/run/nova/claude-state/.claude.json
  # The jobs worker runs ACP agents as agents.task jobs (delegate_async) and
  # needs the same read-only login for the Claude Code binary.
  jobs:
    volumes:
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
      # ~/.claude.json via the staged directory; see the gateway above.
      - type: bind
        source: ${NOVA_CLAUDE_STATE_DIR:-${HOME:?HOME must be set}/.nova/claude-state}
        target: /run/nova/claude-state
        read_only: true
        bind:
          create_host_path: true
    environment:
      - NOVA_CLAUDE_STATE_FILE=/run/nova/claude-state/.claude.json
    # The base command plus the symlink the gateway gets from dev-entrypoint.sh.
    # Keep the tail identical to docker-compose-dev.yaml's jobs command
    # (pinned by tests/test_cli_auth_overlay.py).
    command:
      - sh
      - -c
      - 'ln -sfn "$$NOVA_CLAUDE_STATE_FILE" /root/.claude.json; cd /app/backend && PYTHONPATH=. exec uv run --no-sync python -m app.jobs.worker'
