# Nova — production stack for the public deployment (nova.alilabsx.com).
#
# Usage (via PM2, which is what actually runs it):
#   NOVA_STACK=prod pm2 restart nova --update-env   # → scripts/pm2-nova.sh
# Build first (the launcher runs --no-build):
#   docker compose -f docker/docker-compose.nova-prod.yaml -p nova build
# Switching the live deployment from the dev stack, with rollback and expected
# downtime: docker/README.md, "Switching the public deployment to the prod stack".
#
# ── Image names ─────────────────────────────────────────────────────────────
# gateway/jobs/frontend carry explicit `image:` names (nova-*-prod). Without
# them compose names a build <project>-<service> — `nova-gateway`, exactly the
# tag the running DEV stack uses (its jobs service even pins
# nova-gateway:latest). Building this file would then re-point that tag at the
# prod image, and the next `pm2 restart nova` of the dev stack would recreate
# its gateway and jobs on an image with no toolchain, a different user and a
# different layout. Separate names make building prod side-effect free.
#
# ── Why this file exists ────────────────────────────────────────────────────
# The public site used to be served by docker-compose-dev.yaml + the dood and
# prod-frontend overlays. That worked, but the gateway ran uvicorn with
# `--reload` and re-ran `uv sync` on every boot. On 2026-08-17 the reload
# supervisor died with "Too many open files" (inotify instance exhaustion) —
# and because it was PID 1, the container exited rather than degrading, taking
# the site down in a crash-loop. A production serving surface has no business
# running a filesystem watcher.
#
# It is a standalone file rather than another overlay because Compose merges
# `volumes:` by APPENDING (keyed on target) — an overlay can override `command:`
# and `build.target:` but can never REMOVE a base mount. docker-compose.prod-
# frontend.yaml demonstrates the limit: the merged frontend runs the prod target
# and `pnpm start`, yet still carries the dev bind mounts for frontend/src,
# frontend/public and next.config.js. Harmless there (Next's prod server serves
# .next/, not src/), fatal for the gateway — gateway-venv:/app/backend/.venv and
# ../backend:/app/backend would shadow the image's baked venv and source.
#
# ── Deliberately carried over from the dev stack (NOT from docker-compose.yaml)
#   * Network nova (formerly deer-flow-dev) / 192.168.200.0/24 with the gateway pinned at
#     192.168.200.3. The frontend hardcodes that address
#     (NOVA_INTERNAL_GATEWAY_BASE_URL) and commit e8d3e7de made it THROW
#     when the value is missing, so the pin is load-bearing. nginx itself is
#     indifferent — it resolves `gateway:8001` through Docker DNS at 127.0.0.11
#     (nginx.conf:104,161).
#   * nginx bound to 127.0.0.1:2026 only. docker-compose.yaml publishes
#     0.0.0.0:2026 AND :443, which on this host would expose the app to the LAN
#     and can collide on 443. The Cloudflare tunnel connects over loopback.
#   * autoheal — restarts the gateway when its healthcheck goes red.
#   * skills mounted READ-WRITE. docker-compose.yaml mounts it :ro, which breaks
#     POST /api/skills/install (it writes skills/custom/).
#   * The DooD socket: config.yaml uses AioSandboxProvider with no
#     provisioner_url, so the gateway starts sandbox containers on the host
#     daemon. See docker-compose.dood.yaml for the security trade-off — the same
#     one applies here, it is just no longer opt-in because this deployment has
#     already made that choice.
#
# provisioner is absent by design: sandbox mode is aio (no provisioner_url).
#
# searxng is NOT absent -- see "Services config.yaml requires" below. This
# comment used to claim "nothing in config.yaml references SearXNG", which was
# already false when written (`config.yaml:81-82` binds web_search to
# http://searxng:8080) and contradicted the section that adds the service back.
# The stale half of that contradiction is what kept searxng out of the launcher's
# start list in scripts/docker.sh, so the container never came up and the
# Privacy panel's SearXNG card was permanently red.

name: ${NOVA_COMPOSE_PROJECT:-nova}

# Log rotation for every service. The Docker daemon on this host sets no
# default log-opts (daemon.json carries only the nvidia runtime), so json-file
# logs grew without bound and a chatty container could fill the disk. 5 x 20 MB
# per container; `docker logs` keeps working.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    logging: *default-logging
    # Digest-pinned (the image the live stack already runs, 2026-11): a floating
    # tag means two `up -d` runs a week apart can differ with no repo change.
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-nginx
    ports:
      # Loopback only — the Cloudflare tunnel (PM2 `tunnel-nova`) is the sole
      # public path in. Binding 0.0.0.0 would silently expose the app to the LAN.
      - "127.0.0.1:2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      # Durable visitor log store (survives container recreation). nginx writes
      # access.jsonl here; scripts/nova-visitors.py reads/prunes it.
      - ../logs/nova:/var/log/nova
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      nova:
        ipv4_address: 192.168.200.2
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2026/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 2026-09 hardening: nginx gets the same autoheal label the dev stack
    # gives the gateway, so a hung proxy gets the same restart treatment.
    # Without it nginx is the only healthchecked service in this compose
    # that the sidecar does NOT touch.
    labels:
      - autoheal=true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 256

  # ── Frontend (Next.js, production build) ───────────────────────────────────
  frontend:
    logging: *default-logging
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NOVA_INTERNAL_GATEWAY_BASE_URL: http://192.168.200.3:8001
        DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://192.168.200.3:8001
    # See "Image names" in the header: never the dev stack's nova-frontend.
    image: nova-frontend-prod:${NOVA_PROD_IMAGE_TAG:-latest}
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-frontend
    # `pnpm start` against the baked `next build`. No source bind mounts: the
    # prod image is self-contained, and mounting host src over it is what made
    # the old overlay confusing (see the header).
    command: sh -c "cd frontend && exec pnpm start"
    working_dir: /app
    environment:
      - NODE_ENV=production
      # Direct bridge IP, not the `frontend`→`gateway` service name: SSR fetches
      # from inside this container can fail to resolve after a container
      # recreation (Docker DNS returns SERVFAIL until the network settles).
      # gateway-config.ts throws when this is unset — deliberately loud.
      - NOVA_INTERNAL_GATEWAY_BASE_URL=http://192.168.200.3:8001
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://192.168.200.3:8001
      # Production serving surface: auth ON. Never default this to 1 here.
      - NOVA_AUTH_DISABLED=${NOVA_AUTH_DISABLED:-${DEER_FLOW_AUTH_DISABLED:-0}}
      - DEER_FLOW_AUTH_DISABLED=${NOVA_AUTH_DISABLED:-${DEER_FLOW_AUTH_DISABLED:-0}}
      # Heap ceiling below mem_limit so V8 collects harder instead of being
      # OOM-killed (which surfaces to users as a bare nginx 502).
      - NODE_OPTIONS=--max-old-space-size=1536
    env_file:
      - ../frontend/.env
    networks:
      nova:
        ipv4_address: 192.168.200.4
        # nginx.conf proxies to nova-frontend:3000. The alias keeps that name
        # resolvable while a not-yet-migrated host still runs deer-flow-frontend.
        aliases:
          - nova-frontend
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    pids_limit: 512
    # 2 GiB, not the dev stack's 6: that ceiling existed because `next dev` with
    # Turbopack holds the whole module graph, source maps and HMR history
    # resident and grows with every recompile. `next start` serves a fixed
    # prebuilt bundle and has no such growth.
    mem_limit: 2g
    # Detect a hung-but-"Up" frontend so the autoheal sidecar can restart it.
    # Same hardening the dev stack applied after the 2026-08-28 41-minute
    # 502 outage: without a healthcheck, an exited container holds the
    # service name and `docker compose up` recreates with "name already in
    # use" forever while nginx SERVFAILs every non-/api request. wget is in
    # the image (BusyBox); a 200 on / proves Next is actually serving, not
    # just listening.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      # Prod `next start` cold-start is faster than the dev stack's `pnpm
      # install` + Turbopack warm-up (60s vs 90s). Below the dev value, above
      # the 30s probe interval × retries so a legit slow boot doesn't flap.
      start_period: 60s
    labels:
      - autoheal=true

  # ── Gateway API + agent runtime ────────────────────────────────────────────
  gateway:
    logging: *default-logging
    build:
      context: ../
      dockerfile: backend/Dockerfile
      # No `target:` — this builds the final stage: no compiler toolchain, and
      # the venv baked in at build time instead of `uv sync` on every boot.
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        # Comma-separated; parsed by docker/uv-sync-extras.sh at build time.
        # In the dev stack this was a runtime env var consumed by
        # dev-entrypoint.sh — here the extras must be baked into the image.
        # The default was empty, which built an image WITHOUT the postgres
        # extra: config.yaml's postgres backend then died at import. CPU
        # `voice`, not `voice-gpu`: the GPU path also needs the CUDA 12 wheels
        # that `make voice-libs` installs out of band, which no image has.
        UV_EXTRAS: ${NOVA_PROD_UV_EXTRAS:-${UV_EXTRAS:-postgres,trading,voice}}
    # See "Image names" in the header: never the dev stack's nova-gateway.
    image: nova-gateway-prod:${NOVA_PROD_IMAGE_TAG:-latest}
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-gateway
    # Pinned IP: nginx and the frontend both address the gateway here, and the
    # bridge IP would otherwise change on every container recreation.
    networks:
      nova:
        ipv4_address: 192.168.200.3
    # Loopback, like the dev stack: host-side probes (healthcheck daemon, the
    # gates, `curl localhost:8001/health`) address the gateway here.
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        # Healthy, not merely started: create_app() opens the database, and a
        # Postgres still in initdb refuses the connection (2026-08-17 shape).
        condition: service_healthy
    # No --reload, and no uv sync. `--no-sync` keeps uv from touching the baked
    # venv at startup (it would need write access we deliberately do not grant).
    # The graceful-shutdown bound stops a restart from hanging forever on the
    # UI's long-lived SSE connections.
    #
    # Schema first: the dev entrypoint runs scripts/db-migrate.sh on every boot
    # (audit PROD-001: until 2026-09 nothing applied migrations on deploy), and
    # this stack had dropped that step. Baked into the image at
    # /usr/local/bin/db-migrate.sh; opt out with NOVA_DB_MIGRATE=0. Fatal on
    # failure, as in dev. The ln is the cli-auth overlay's ~/.claude.json
    # symlink (no-op unless NOVA_CLAUDE_STATE_FILE is set).
    command:
      - sh
      - -c
      - >-
        if [ -n "$${NOVA_CLAUDE_STATE_FILE:-}" ]; then ln -sfn "$$NOVA_CLAUDE_STATE_FILE" "$${HOME}/.claude.json" || true; fi &&
        if [ "$${NOVA_DB_MIGRATE:-1}" = "1" ]; then NOVA_BACKEND_DIR=/app/backend /usr/local/bin/db-migrate.sh; fi &&
        cd backend &&
        PYTHONPATH=. exec uv run --no-sync uvicorn app.gateway.app:app
        --host 0.0.0.0 --port 8001
        --workers ${GATEWAY_WORKERS:-1}
        --timeout-graceful-shutdown 10
    # Run as the host user (uid 1000) rather than the image's `app` (uid 10001).
    # backend/.nova on the host is owned by uid 1000 and holds live runtime
    # state — sessions, run events, SQLite. Running as 10001 cannot write it
    # (the same class as the cap_drop/DAC_OVERRIDE note in docker-compose-dev
    # .yaml:310-320), and chowning it to 10001 would lock the host user out of
    # their own data. HOME is redirected to the tmpfs below because uid 1000 has
    # no home directory inside this image and uv/python want somewhere to cache.
    user: "1000:1000"
    # /var/run/docker.sock is root:docker mode 0660. uid 1000 gets no
    # supplementary groups inside the container, so without this the DooD mount
    # below is present but unreadable and every sandbox acquire fails with
    # EACCES. The dev stack never hit this because it ran as root. Default is
    # this host's `docker` GID — override DOCKER_GID elsewhere (`getent group
    # docker`).
    group_add:
      - "${DOCKER_GID:-973}"
    working_dir: /app
    volumes:
      # Config files: read-only. The runtime settings UI is deliberately
      # read-only too (app/gateway/routers/runtime.py), so nothing needs to
      # write these. Per-agent config.yaml files live under .nova instead.
      - ../config.yaml:/app/backend/config.yaml:ro
      - ../extensions_config.json:/app/backend/extensions_config.json:ro
      # Read-write: POST /api/skills/install writes skills/custom/.
      - ../skills:/app/skills
      # Runtime state — sessions, run events, per-user threads, SQLite.
      - ../backend/${NOVA_DATA_DIRNAME:-.nova}:/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      # DooD: config.yaml uses AioSandboxProvider with no provisioner_url, so
      # the gateway starts per-thread sandbox containers on the host daemon.
      - ${NOVA_DOCKER_SOCKET:-${DEER_FLOW_DOCKER_SOCKET:-/var/run/docker.sock}}:/var/run/docker.sock
    environment:
      - CI=true
      # Production serving surface: auth ON.
      - NOVA_AUTH_DISABLED=${NOVA_AUTH_DISABLED:-${DEER_FLOW_AUTH_DISABLED:-0}}
      - DEER_FLOW_AUTH_DISABLED=${NOVA_AUTH_DISABLED:-${DEER_FLOW_AUTH_DISABLED:-0}}
      - NOVA_PROJECT_ROOT=/app
      - DEER_FLOW_PROJECT_ROOT=/app
      - NOVA_HOME=/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      - DEER_FLOW_HOME=/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      # MUST be pinned to in-container paths. ../.env carries HOST paths — it
      # has to, because docker-compose.yaml uses ${NOVA_CONFIG_PATH} as a
      # bind-mount *source* — and env_file would otherwise leak them in here,
      # where they do not exist. That is exactly the 2026-08-17 outage: the
      # gateway died at import with FileNotFoundError from
      # AppConfig.resolve_config_path(), uvicorn never bound 8001, and nginx
      # reported "gateway could not be resolved". Note these land at
      # /app/backend/..., matching the mounts above.
      - NOVA_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      # config.yaml references this as $DATABASE_URL. It was set nowhere in
      # this file and is commented out in ../.env, so AppConfig raised
      # "Environment variable DATABASE_URL not found" at import -- this stack
      # could not start at all. Same value as the dev compose.
      - DATABASE_URL=postgresql://${NOVA_PG_USER:-nova}:${NOVA_PG_PASSWORD}@postgres:5432/${NOVA_PG_DB:-nova}
      # The sandbox needs these too; see docker-compose-dev.yaml for why each
      # exists (LAN exposure, and the rate limiter's view past nginx).
      - NOVA_SANDBOX_BIND_HOST=${NOVA_SANDBOX_BIND_HOST:-${DEER_FLOW_SANDBOX_BIND_HOST:-172.17.0.1}}
      - DEER_FLOW_SANDBOX_BIND_HOST=${NOVA_SANDBOX_BIND_HOST:-${DEER_FLOW_SANDBOX_BIND_HOST:-172.17.0.1}}
      - AUTH_TRUSTED_PROXIES=${AUTH_TRUSTED_PROXIES:-192.168.200.0/24}
      - DEERFLOW_VERSION=${DEERFLOW_VERSION:-nova-prod}
      - NOVA_VERSION=${DEERFLOW_VERSION:-nova-prod}
      - NOVA_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - NOVA_CHANNELS_LANGGRAPH_URL=${NOVA_CHANNELS_LANGGRAPH_URL:-${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}}
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${NOVA_CHANNELS_LANGGRAPH_URL:-${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}}
      - NOVA_CHANNELS_GATEWAY_URL=${NOVA_CHANNELS_GATEWAY_URL:-${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${NOVA_CHANNELS_GATEWAY_URL:-${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}}
      - NOVA_INTERNAL_AUTH_TOKEN=${NOVA_INTERNAL_AUTH_TOKEN:-${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}}
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${NOVA_INTERNAL_AUTH_TOKEN:-${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}}
      # DooD path translation: the sandbox provider mounts host directories into
      # sibling containers, so these must be HOST paths, unlike the two above.
      - NOVA_HOST_BASE_DIR=${NOVA_ROOT:-${DEER_FLOW_ROOT}}/backend/${NOVA_DATA_DIRNAME:-.nova}
      - DEER_FLOW_HOST_BASE_DIR=${NOVA_ROOT:-${DEER_FLOW_ROOT}}/backend/${NOVA_DATA_DIRNAME:-.nova}
      - NOVA_HOST_SKILLS_PATH=${NOVA_ROOT:-${DEER_FLOW_ROOT}}/skills
      - DEER_FLOW_HOST_SKILLS_PATH=${NOVA_ROOT:-${DEER_FLOW_ROOT}}/skills
      - NOVA_SANDBOX_HOST=host.docker.internal
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      # uid 1000 has no home in this image; give uv/python a writable cache.
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - UV_CACHE_DIR=/tmp/.cache/uv
      - PYTHONDONTWRITEBYTECODE=1
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,searxng,crawl4ai,browserless,postgres,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,searxng,crawl4ai,browserless,postgres,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      # Writable scratch for HOME/caches above. Sized for uv metadata and
      # tempfiles, not for user data (that goes to .nova).
      - /tmp:size=512m
    restart: unless-stopped
    # Detects a hung-but-"Up" gateway (the 2026-07-16 failure mode: uvicorn
    # dead, container still Up, nginx timing out). No curl/wget in this image.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      # Much shorter than the dev stack's 150s: there is no startup `uv sync`.
      start_period: 60s
    labels:
      - autoheal=true
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    mem_limit: 6g

  # ── Job runner ─────────────────────────────────────────────────────────────
  # The worker behind /api/jobs (campaign sends, imports, delegate_async agent
  # tasks). The dev stack runs it; this file did not, so switching to prod
  # would have silently stopped every background job. Same image as the
  # gateway (never built here), no ports, no Docker socket, so a gateway
  # restart cannot kill an in-flight job. Waits for a *healthy* gateway because
  # the gateway runs the schema step. Scale to zero with NOVA_JOBS_SCALE=0.
  jobs:
    logging: *default-logging
    image: nova-gateway-prod:${NOVA_PROD_IMAGE_TAG:-latest}
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-jobs
    # Same string as docker-compose-dev.yaml's jobs command, so the cli-auth
    # overlay's override (which prepends the ~/.claude.json link) fits both.
    command: ["sh", "-c", "cd /app/backend && PYTHONPATH=. exec uv run --no-sync python -m app.jobs.worker"]
    user: "1000:1000"
    working_dir: /app
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      # Pinned: after a reboot an unpinned jobs container came up first and
      # took the gateway's .3 (dev stack, 2026-10).
      nova:
        ipv4_address: 192.168.200.9
    env_file:
      - ../.env
    environment:
      # In-container paths, pinned over the host paths ../.env carries (see
      # the gateway's note on the 2026-08-17 outage).
      - NOVA_PROJECT_ROOT=/app
      - DEER_FLOW_PROJECT_ROOT=/app
      - NOVA_HOME=/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      - DEER_FLOW_HOME=/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      - NOVA_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - NOVA_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DATABASE_URL=postgresql://${NOVA_PG_USER:-nova}:${NOVA_PG_PASSWORD}@postgres:5432/${NOVA_PG_DB:-nova}
      - NOVA_INTERNAL_AUTH_TOKEN=${NOVA_INTERNAL_AUTH_TOKEN:-${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}}
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${NOVA_INTERNAL_AUTH_TOKEN:-${DEER_FLOW_INTERNAL_AUTH_TOKEN:-}}
      - DEERFLOW_VERSION=${DEERFLOW_VERSION:-nova-prod}
      - NOVA_VERSION=${DEERFLOW_VERSION:-nova-prod}
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - UV_CACHE_DIR=/tmp/.cache/uv
      - PYTHONDONTWRITEBYTECODE=1
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,postgres,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,postgres,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config.yaml:/app/backend/config.yaml:ro
      - ../extensions_config.json:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills
      - ../backend/${NOVA_DATA_DIRNAME:-.nova}:/app/backend/${NOVA_DATA_DIRNAME:-.nova}
    tmpfs:
      - /tmp:size=512m
    healthcheck:
      test: ["CMD", "sh", "-c", "cd /app/backend && PYTHONPATH=. uv run --no-sync python -m app.jobs.healthcheck --max-age 90"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 3g
    pids_limit: 256
    restart: unless-stopped

  # ── Autoheal ───────────────────────────────────────────────────────────────
  # Restarts any container labelled autoheal=true when Docker reports it
  # unhealthy — the auto-recovery missing during the 2026-07-16 outage.
  autoheal:
    logging: *default-logging
    image: willfarrell/autoheal@sha256:2ae2ff2c4047be936db416005262978b0d20d98d8f8dbfd2bc8bb97bbfc1a7b5
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-autoheal
    restart: unless-stopped
    # A shell loop and curl; bounded like every other service on the host.
    mem_limit: 128m
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=60
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Sidecar liveness — mirrors docker-compose-dev.yaml's autoheal block.
    # Without this, a stuck autoheal process leaves every ``autoheal=true``
    # container silently unmonitored (no other supervisor). The curl ``/_ping``
    # confirms the mounted Docker socket is reachable; the pgrep confirms
    # the main autoheal script is still in its poll loop.
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s --unix-socket /var/run/docker.sock -f http://localhost/_ping >/dev/null && pgrep -f docker-entrypoint >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 75s

  # ── Services config.yaml requires ────────────────────────────────────────
  # This stack previously defined only nginx/frontend/gateway/autoheal, while
  # config.yaml points at postgres, searxng, browserless and crawl4ai. The
  # database failure was loud (AppConfig raises at import when DATABASE_URL is
  # unset) but the three web services failed silently: config.yaml documents
  # the DDG fallback as silent, so `web_search` simply got quietly worse.
  #
  # Kept verbatim from docker-compose-dev.yaml, including the digest pins. This
  # file is standalone by design (see the header), so the duplication is
  # deliberate -- but the two copies must be changed together.

  postgres:
    logging: *default-logging
    # Digest-pinned like the rest. Never let a pull move the database engine;
    # bump the digest deliberately (and pg_upgrade for a major).
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-postgres
    environment:
      - POSTGRES_DB=${NOVA_PG_DB:-nova}
      - POSTGRES_USER=${NOVA_PG_USER:-nova}
      - POSTGRES_PASSWORD=${NOVA_PG_PASSWORD:?Set NOVA_PG_PASSWORD in .env}
      # Nova stores UTF-8 conversation text; the image default is fine but
      # pinning it stops a host-locale surprise on a rebuild.
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    ports:
      # Loopback only. Nothing outside this machine has any business reaching
      # it, and the gateway talks to it over the compose network.
      - "127.0.0.1:${NOVA_PG_PORT:-5433}:5432"
    volumes:
      - nova-postgres-data:/var/lib/postgresql/data
    networks:
      nova:
        # Pinned like the gateway (.3) and frontend (.4): Docker's embedded DNS
        # has SERVFAILed on service names after a container recreation on this
        # host (see the frontend's note), and a database the gateway cannot
        # resolve is indistinguishable from a database that is down.
        ipv4_address: 192.168.200.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOVA_PG_USER:-nova} -d ${NOVA_PG_DB:-nova}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    # 2026-09 hardening: every long-running service that already has a
    # healthcheck gets the autoheal label so a stuck container (Postgres
    # full disk, connection storm) gets restarted automatically. The
    # gateway label was already present from the 2026-07-16 hardening.
    labels:
      - autoheal=true
    security_opt:
      - no-new-privileges:true

  # Self-hosted headless Chrome for web_fetch. Nova's fetch path was Jina's
  # hosted API, whose key expired -- and because the tool silently falls back to
  # a plain HTTP GET, it kept returning plausible output while article
  # extraction was off, for 118 logged 401s. Self-hosting removes the key, the
  # quota and the silent-degradation mode in one move.
  #
  # Chosen over the firecrawl module already in the tree because that one
  # constructs FirecrawlApp(api_key=...) with no base_url, so it can only talk
  # to the cloud service; browserless takes a base_url and self-hosts as-is.
  # It renders JS/SPAs, and the gateway extracts the article from the returned
  # HTML with readabilipy -- so keep that path healthy (dev-entrypoint.sh
  # repairs it at boot) or this returns whole pages instead of articles.

  searxng:
    logging: *default-logging
    # Digest-pinned; see the crawl4ai service above for the reasoning.
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-searxng
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?Set SEARXNG_SECRET_KEY in .env}
      - SEARXNG_BASE_URL=http://searxng:8080
    networks:
      nova:
        # Static like everything else on this network (dev stack: same .6).
        # Unpinned, IPAM hands out the lowest free address -- nginx's .2 --
        # and whichever container starts second fails with "Address already
        # in use".
        ipv4_address: 192.168.200.6
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      # SearXNG + uwsgi boot slower than 3x30s on a contended host, and without a
      # grace period the container flaps to `unhealthy` before it is ever ready.
      start_period: 30s
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # 2026-09 hardening: autoheal label for the search service.
    labels:
      - autoheal=true
    restart: unless-stopped

  # TOR proxy removed: it crash-looped under the non-root hardening (setgid
  # EPERM) and is not needed for the default stack. Re-add a hardened Tor
  # service here if iGIN0 anonymized fetching is required.

  # Autoheal: restarts any container marked `autoheal=true` (currently the
  # gateway) when its Docker healthcheck reports unhealthy. This is the
  # missing auto-recovery from the 2026-07-16 outage — a hung-but-Up gateway
  # now self-heals within ~15s instead of taking the site down until a human
  # notices. Watches the Docker socket read-only-ish (needs it to issue the
  # restart); no ports, minimal footprint.

  browserless:
    logging: *default-logging
    # Digest-pinned; see the crawl4ai service below for the reasoning.
    image: ghcr.io/browserless/chromium@sha256:c0886239e4eaa102e214acbbde5345f5b2a55a7ccbb52456048afd374defbabb
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-browserless
    # Every other service in this file sets this. Without it these two stay
    # down after a host reboot or a dockerd restart while the rest come back,
    # so web_fetch / web_fetch_many / web_crawl silently fall through to their
    # DDG fallback and nothing looks broken.
    restart: unless-stopped
    ports:
      - "127.0.0.1:3032:3000"
    environment:
      - CONCURRENT=2
      - TIMEOUT=30000
      - TOKEN=${BROWSERLESS_TOKEN:-}
    networks:
      # Pinned. This network hands out fixed addresses to nginx/gateway/
      # frontend/postgres, and an unpinned service just takes the next free
      # one -- which, while the gateway happened to be down, was the gateway's
      # own 192.168.200.3. The gateway then could not restart at all:
      # "failed to set up container networking: Address already in use".
      nova:
        ipv4_address: 192.168.200.7
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 2026-09 hardening: autoheal label for the headless browser.
    labels:
      - autoheal=true
    # Chrome is memory-hungry and this box has an OOM history; two concurrent
    # sessions inside 1.5g is enough for fetch-a-page work without competing
    # with the gateway.
    mem_limit: 1500m
    mem_reservation: 512m
    shm_size: 1gb
    security_opt:
      - "no-new-privileges:true"

  # Self-hosted Crawl4AI. Distinct from browserless, which renders one URL the
  # agent already names -- this follows links, so "read this docs site" is one
  # tool call instead of the agent hand-rolling a crawl a fetch at a time.
  #
  # Runs as a service rather than a gateway dependency: the library ships its
  # own Playwright browser download, which would put a second headless-Chrome
  # stack inside the gateway image next to the one browserless already is.

  crawl4ai:
    logging: *default-logging
    # Pinned by digest, not :latest. A floating tag means two `up -d` runs
    # a week apart can differ with no change in this repo — the same
    # reproducibility hole Dockerfile.base closed for the sandbox.
    image: unclecode/crawl4ai@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-crawl4ai
    # Every other service in this file sets this. Without it these two stay
    # down after a host reboot or a dockerd restart while the rest come back,
    # so web_fetch / web_fetch_many / web_crawl silently fall through to their
    # DDG fallback and nothing looks broken.
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    volumes:
      # Upstream binds 127.0.0.1 inside the container, so the published port
      # reaches nothing and the gateway cannot see it at all. This override
      # only changes the bind address.
      - ./crawl4ai/config.yml:/app/config.yml:ro
    environment:
      # Required for the non-loopback bind above; without it the server refuses
      # to start on 0.0.0.0, which is the correct default for a crawler.
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN in .env}
    networks:
      # Pinned like everything else here. An unpinned service takes the next
      # free address, and when the gateway was briefly down that was the
      # gateway's own .3 -- which then could not restart at all.
      nova:
        ipv4_address: 192.168.200.8
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 2026-09 hardening: autoheal label for the link-following crawler.
    labels:
      - autoheal=true
    # Chrome again, and a crawler drives several tabs at once. Bounded for the
    # same reason browserless is.
    mem_limit: 2g
    mem_reservation: 512m
    shm_size: 1gb
    security_opt:
      - "no-new-privileges:true"

volumes:
  nova-postgres-data:

networks:
  # Same name, subnet and addressing as the dev stack so the pinned
  # 192.168.200.3 stays valid and nothing downstream has to be re-pointed.
  nova:
    name: nova
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
