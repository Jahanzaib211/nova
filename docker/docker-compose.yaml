# Nova Production Environment
# Usage: make up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API + agent runtime
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via environment/.env or scripts/deploy.sh):
#   NOVA_PROJECT_ROOT           — project root for relative runtime paths
#   NOVA_HOME                   — runtime data dir, default .nova under $NOVA_PROJECT_ROOT (or cwd)
#   NOVA_CONFIG_PATH            — path to config.yaml
#   NOVA_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   NOVA_SKILLS_PATH            — skills dir, default $NOVA_PROJECT_ROOT/skills
#   NOVA_DOCKER_SOCKET          — Docker socket path for aio/DooD mode, default /var/run/docker.sock (used only by the opt-in docker-compose.dood.yaml overlay)
#   NOVA_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   NOVA_INTERNAL_AUTH_TOKEN    — shared internal Gateway auth token for multi-worker IM channels
#   (each NOVA_<X> falls back to the legacy DEER_FLOW_<X> for one release)
#
# LangSmith tracing is disabled by default (LANGSMITH_TRACING=false).
# Set LANGSMITH_TRACING=true and LANGSMITH_API_KEY in .env to enable it.
#
# Access: http://localhost:${PORT:-2026}

# Log rotation for every service. The Docker daemon on this host sets no
# default log-opts (daemon.json carries only the nvidia runtime), so json-file
# logs grew without bound and a chatty container could fill the disk. 5 x 20 MB
# per container; `docker logs` keeps working.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    logging: *default-logging
    # Digest-pinned (the image the live stack already runs, 2026-11): a floating
    # tag means two `up -d` runs a week apart can differ with no repo change.
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-nginx
    ports:
      - "${PORT:-2026}:2026"
      # TLS termination (Batch 2A) — port 443 is mapped only when TLS_ENABLED=1
      # and cert files are mounted at /etc/nginx/certs/. Operators provision
      # ./certs/tls.crt + tls.key themselves; nginx.tls.conf handles the routing.
      - "${TLS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./nginx/nginx.tls.conf:/etc/nginx/nginx.tls.conf.template:ro
      # Optional cert mount; the entrypoint only appends the TLS block when
      # both files are present.
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    command: >
      sh -c "cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
      && if [ \"$${TLS_ENABLED:-0}\" = '1' ] && [ -f /etc/nginx/certs/tls.crt ] && [ -f /etc/nginx/certs/tls.key ]; then
           echo '    include /etc/nginx/nginx.tls.conf;' >> /etc/nginx/nginx.conf
         fi
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - nova
    restart: unless-stopped
    # v7.2 Batch 2A: drop all capabilities, add only NET_BIND_SERVICE for
    # listening on 80/443, prevent privilege escalation, cap PID count.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 256
    # 2026-09 hardening parity: mem_limit + healthcheck + autoheal label.
    # Without these nginx (the only public entrypoint) is one unbounded
    # container or one EXIT-137 worker OOM away from taking the whole site
    # down: it has no supervisor, no recovery. The dev stack already had
    # the healthcheck but not the autoheal label; the prod stack already
    # had both; this base file had neither.
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2026/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - autoheal=true

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    logging: *default-logging
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NOVA_INTERNAL_GATEWAY_BASE_URL: http://gateway:8001
        DEER_FLOW_INTERNAL_GATEWAY_BASE_URL: http://gateway:8001
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      # This stack's own gateway, by service name. It used to point at
      # 192.168.200.3 — the DEV stack's pinned gateway — through an extra
      # attachment to the dev network `deer-flow-dev_deer-flow-dev`, which
      # this file never declares; after the rename `compose config` rejected
      # the whole file ("refers to undefined network"), so `make up` could
      # not start at all.
      - NOVA_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - nova
    restart: unless-stopped
    # v7.2 Batch 2A: USER nextjs added in Dockerfile; harden the runtime.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # /tmp and .next cache need to be writable; provide them via tmpfs.
    tmpfs:
      - /tmp:size=64m
    pids_limit: 512
    # 2026-09 hardening parity with docker-compose-dev.yaml's frontend:
    # mem_limit, healthcheck, and autoheal label all added so this base
    # compose file gets the same auto-recovery the dev and nova-prod stacks
    # do. Without this, `make up` (which uses this file via deploy.sh) is
    # one frontend crash away from the same 2026-08-28 41-minute outage
    # the dev stack just recovered from.
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    logging: *default-logging
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
        UV_EXTRAS: ${UV_EXTRAS:-}
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-gateway
    # Gateway hosts the agent runtime with in-process RunManager + StreamBridge
    # singletons -- run state lives in this worker's memory. Default to a single
    # worker: with >1 worker and no nginx sticky sessions, run cancel, SSE
    # reconnect, request dedup, and per-worker IM channel services all break
    # across workers until a shared (e.g. redis) stream bridge lands, which is
    # not yet implemented. Override GATEWAY_WORKERS only once that is in place.
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-1}"
    volumes:
      - ${NOVA_CONFIG_PATH:-${DEER_FLOW_CONFIG_PATH}}:/app/backend/config.yaml:ro
      - ${NOVA_EXTENSIONS_CONFIG_PATH:-${DEER_FLOW_EXTENSIONS_CONFIG_PATH}}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${NOVA_HOME:-${DEER_FLOW_HOME}}:/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      # DooD: the host Docker socket is NOT mounted by default. It is added only
      # for aio (pure-DooD) sandbox mode via the opt-in docker-compose.dood.yaml
      # overlay (appended by scripts/deploy.sh). See backend/docs/CONFIGURATION.md
      # Security Note section for details.

      # CLI auth dirs (Claude Code / Codex) are NOT mounted by default: they
      # expose the entire ~/.claude and ~/.codex (history, projects, global
      # config, credentials) into the container. Mount them only when you use
      # the Claude/Codex CLI login as a model provider or ACP agent, via the
      # opt-in docker-compose.cli-auth.yaml overlay. Prefer an env token
      # (CLAUDE_CODE_OAUTH_TOKEN, see .env.example / backend/docs/CONFIGURATION.md).
    working_dir: /app
    environment:
      - CI=true
      - NOVA_PROJECT_ROOT=/app
      - DEER_FLOW_PROJECT_ROOT=/app
      - NOVA_HOME=/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      - DEER_FLOW_HOME=/app/backend/${NOVA_DATA_DIRNAME:-.nova}
      - NOVA_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - NOVA_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - NOVA_CHANNELS_LANGGRAPH_URL=${NOVA_CHANNELS_LANGGRAPH_URL:-${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}}
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${NOVA_CHANNELS_LANGGRAPH_URL:-${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}}
      - NOVA_CHANNELS_GATEWAY_URL=${NOVA_CHANNELS_GATEWAY_URL:-${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${NOVA_CHANNELS_GATEWAY_URL:-${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}}
      - NOVA_INTERNAL_AUTH_TOKEN=${NOVA_INTERNAL_AUTH_TOKEN:-${DEER_FLOW_INTERNAL_AUTH_TOKEN}}
      - DEER_FLOW_INTERNAL_AUTH_TOKEN=${NOVA_INTERNAL_AUTH_TOKEN:-${DEER_FLOW_INTERNAL_AUTH_TOKEN}}
      # Batch 2B.5: required by config.yaml's $MINIMAX_API_KEY reference.
      # Without it the gateway returns 503 "Configuration not available"
      # for any endpoint that calls get_config(). Default placeholder is
      # documented in .env.example; operators must set a real key.
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-your-minimax-api-key}
      # DooD path/network translation
      - NOVA_HOST_BASE_DIR=${NOVA_HOME:-${DEER_FLOW_HOME}}
      - DEER_FLOW_HOST_BASE_DIR=${NOVA_HOME:-${DEER_FLOW_HOME}}
      - NOVA_HOST_SKILLS_PATH=${NOVA_REPO_ROOT:-${DEER_FLOW_REPO_ROOT}}/skills
      - DEER_FLOW_HOST_SKILLS_PATH=${NOVA_REPO_ROOT:-${DEER_FLOW_REPO_ROOT}}/skills
      - NOVA_SANDBOX_HOST=host.docker.internal
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      # Proxy values (HTTP_PROXY/HTTPS_PROXY/ALL_PROXY) are inherited from ../.env via env_file.
      # Only NO_PROXY is declared here so internal service hostnames are always exempt from the proxy.
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,provisioner,host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nova
    restart: unless-stopped
    # v7.2 Batch 2A: USER app added in Dockerfile; harden the runtime.
    # Note: read_only is NOT set because the gateway writes runtime state to
    # ${NOVA_HOME}:/app/backend/.nova (sessions, run events, audit).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # /tmp must be writable for Python / uv scratch.
    tmpfs:
      - /tmp:size=128m
    pids_limit: 512
    # Bounded like the dev/prod stacks' gateway (6g there).
    mem_limit: 6g
    # 2026-09 hardening parity with the dev/prod stacks: detect a hung
    # gateway and let the autoheal sidecar restart it. Without the
    # healthcheck+label pair, this base compose file (used by `make up`
    # via deploy.sh) is one uvicorn deadlock away from a silent outage.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    logging: *default-logging
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: ${NOVA_CONTAINER_PREFIX:-nova}-provisioner
    volumes:
      - ${KUBECONFIG_PATH:-~/.kube/config}:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${NOVA_REPO_ROOT:-${DEER_FLOW_REPO_ROOT}}/skills
      - THREADS_HOST_PATH=${NOVA_HOME:-${DEER_FLOW_HOME}}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nova
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
networks:
  nova:
    driver: bridge
