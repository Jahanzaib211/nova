# Nova Observability Stack — Grafana + Prometheus + Loki + Alloy + Blackbox + Uptime Kuma
# Usage: docker compose -f docker/monitoring/docker-compose.yaml up -d
# Supervised by PM2 app `nova-monitoring` (see ecosystem.config.js).
#
# Everything runs with host networking bound to 127.0.0.1 ONLY (repo rule:
# never 0.0.0.0). Host mode is required — the two richest scrape targets
# (cloudflared :20001, nginx :2026) are loopback-bound on the host, and
# Alloy tails host files (~/.pm2/logs, logs/nova, journal).
#
# Ports (all loopback):
#   grafana 3002  prometheus 9090  loki 3100
#   alloy 12345  node_exporter 9100  cadvisor 9181
#   blackbox 9115  uptime-kuma 3001
#
# Public exposure via Cloudflare tunnel — see docs/MONITORING.md.
# Self-hosted external probe: Uptime Kuma at :3001 (probes public endpoints
# from its own network location, not localhost — closes the "CF edge died" gap).

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: nova-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.6.12
    container_name: nova-loki
    network_mode: host
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.9.1
    container_name: nova-alloy
    network_mode: host
    # Needs root: journal + docker.sock + ~/.pm2 log reads.
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ../../logs/nova:/host/logs/nova:ro
      - ${HOME:-/home/jahanzaib}/.pm2/logs:/host/pm2-logs:ro
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - loki

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: nova-node-exporter
    network_mode: host
    pid: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
      - --collector.systemd
    volumes:
      - /:/host:ro,rslave
      - /run/systemd:/run/systemd:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      # Read PM2 metrics via the node_exporter's process/node collectors on the host.
      # The host /proc and /sys are already mounted ro; PM2 metrics are available
      # at the host level (node_procs_running, etc.). No custom textfile needed.
    mem_limit: 128m
    restart: unless-stopped

  # Prometheus Blackbox Exporter — self-hosted synthetic probing.
  # Uptime Kuma (:3003) probes public endpoints from its own network.
  # Blackbox (:9115) probes internal TCP/HTTP from the host.
  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: nova-blackbox
    network_mode: host
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Uptime Kuma — self-hosted status page + external probing from Kuma's network.
  # Public: status.alilabsx.com (Cloudflare Access).
  # Probes nova.alilabsx.com/health from Uptime Kuma's cloud location (not localhost).
  # Fills the "Cloudflare edge died" gap that localhost probes can't catch.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: nova-uptime-kuma
    network_mode: host
    ports:
      - "127.0.0.1:3003:3001"
    volumes:
      - uptime-kuma-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - UPTIME_KUMA_PORT=3003
      - UPTIME_KUMA_HOST=0.0.0.0
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: nova-cadvisor
    network_mode: host
    command:
      - --listen_ip=127.0.0.1
      - --port=9181
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.0.1
    container_name: nova-grafana
    network_mode: host
    user: "1000:1000"
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3002
      # Public URL once the tunnel hostname is wired (docs/MONITORING.md).
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://127.0.0.1:3002}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/nova-home.json
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  # Uptime Kuma SQLite DB.
  uptime-kuma-data:
