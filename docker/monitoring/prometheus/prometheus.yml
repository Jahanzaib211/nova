# Nova monitoring — Prometheus scrape config.
# Targets are all loopback; see docker/monitoring/docker-compose.yaml.
#
# Recording rules are in prometheus/rules/*.yml (generated by sloth).
# Prometheus auto-reloads via --web.enable-lifecycle (SIGHUP).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Cloudflare tunnel connector — request rate, latency, HA connection state.
  - job_name: cloudflared
    static_configs:
      - targets: ["127.0.0.1:20001"]

  # Nova gateway (via nginx :2026) — browser/sandbox subsystem metrics from
  # deerflow.sandbox.metrics (hand-rolled Prometheus registry).
  - job_name: nova-gateway
    metrics_path: /api/metrics
    static_configs:
      - targets: ["127.0.0.1:2026"]

  # Blackbox Exporter — synthetic HTTP/TCP/ICMP probes from the host.
  # Uptime Kuma probes public endpoints from its own network (see :3003).
  # Blackbox fills internal gap: is nginx reachable from host? is the tunnel alive?
  #
  # Correct blackbox scrape pattern (counter to earlier broken config):
  #   - metrics_path MUST be /probe (not /metrics) — /metrics only returns
  #     blackbox's self-metrics, never runs the probe.
  #   - static_configs uses the FULL URL (with scheme) as the target.
  #   - params sets the module name globally (avoids relabel gymnastics).
  #   - The first relabel copies __address__ into __param_target so the URL
  #     is forwarded to /probe as `?target=<url>&module=http_2xx`.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Probed by blackbox from host (cloudflared → nginx path)
          - http://127.0.0.1:2026/health
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        regex:         'http://127.0.0.1:2026/health'
        replacement:   'nova-internal-health'
        target_label:  instance
      - target_label:  __address__
        replacement:   '127.0.0.1:9115'  # blackbox exporter

  # llama-server — only answers if started with --metrics; harmless 501 → down
  # until the launcher gains the flag (see docs/MONITORING.md).
  - job_name: llama-server
    static_configs:
      - targets: ["127.0.0.1:8081"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:9181"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3002"]

# ── Recording rules (generated by sloth; see sloth/slos.yaml) ─────────────
rule_files:
  - "rules/*.yml"
