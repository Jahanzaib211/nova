events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Global upload limit (override per-location as needed) ────────────
    # 25 MB matches typical LangGraph SSE payloads; the uploads location
    # below bumps it to 100 MB for file attachments.
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # ── Service resolution (Batch 2B.5) ──────────────────────────────────
    # We previously used Docker's internal DNS resolver (127.0.0.11), but it
    # occasionally serves stale SERVFAIL after container restarts, which nginx
    # caches for `valid=10s` and blocks all upstream calls. Falling back to
    # the OS resolver (/etc/hosts + glibc) lets the container pick up DNS
    # changes via /etc/hosts without restart, and avoids the SERVFAIL cache.
    #
    # When running with Docker Compose, ensure each upstream service has a
    # matching /etc/hosts entry (the dev-entrypoint.sh auto-populates this
    # from the Docker network gateway). Operators using Kubernetes should add
    # the cluster DNS resolver here instead.
    # resolver 127.0.0.11 valid=10s ipv6=off;  # intentionally disabled

    # ── Rate limiting zones (v7.2 audit, Batch 2A) ────────────────────────
    # Auth endpoints get a strict per-IP limit; the wider API zone covers
    # the rest. Zones are shared across all server blocks below.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;

    # ── Security headers (v7.2 audit, Batch 2A) ──────────────────────────
    # Applied as a reusable map: the more permissive CSP for the app shell,
    # a stricter one for /api/ routes (no scripts/frames needed).
    map $uri $csp_policy {
        default    "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
        ~^/api/    "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    }

    # X-Powered-By and Server header hardening (built-in; nginx-extras module
    # would let us strip more, but the base nginx:alpine image only supports
    # server_tokens off and the proxy_set_header X-Powered-By "" pattern.)
    server_tokens off;

    # ── Main server (path-based routing) ─────────────────────────────────
    server {
        listen 2026 default_server;
        listen [::]:2026 default_server;
        server_name _;

        # Upstream IPs (Batch 2B.5): pinned to Docker bridge subnet so nginx
        # never has to resolve service names. Production / multi-host setups
        # should replace these with a real service-discovery layer.
        # The IPs match the docker-compose `deer-flow` network subnet
        # (192.168.200.0/24, see docker/docker-compose.yaml).
        set $gateway_upstream  192.168.200.3:8001;
        set $frontend_upstream 192.168.200.4:3000;

        # Default proxy settings for all locations (streaming/SSE support)
        proxy_buffering off;
        proxy_cache off;

        # ── Global security headers (sent on every response) ────────────
        add_header Content-Security-Policy       $csp_policy always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options                "DENY" always;
        add_header X-Content-Type-Options         "nosniff" always;
        add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy             "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy     "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
        # `always` ensures the headers are sent even on 4xx/5xx so the browser
        # sees them on error pages too.

        # Keep the unified nginx endpoint same-origin by default. When split
        # frontend/backend or port-forwarded deployments need browser CORS,
        # configure the Gateway allowlist with GATEWAY_CORS_ORIGINS so CORS and
        # CSRF origin checks stay aligned instead of approving every origin at
        # the proxy layer.

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;

            # Headers — X-Forwarded-For is set to the *peer* only (no chain)
            # so the gateway's trusted-proxy logic sees a single hop. Any
            # upstream LB should append X-Real-IP before this nginx.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_set_header X-Accel-Buffering no;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Uploads endpoint (rate-limited; large body allowed)
        location ~ ^/api/threads/[^/]+/uploads {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large file upload support
            client_max_body_size 100M;
            proxy_request_buffering off;

            # Disable response buffering to avoid permission errors
        }

        # Custom API: Other endpoints under /api/threads
        location ~ ^/api/threads {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Auth endpoints — strict per-IP limit (10 req/min) for login etc.
        # Mitigates credential-stuffing and account-enumeration attacks.
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Documentation: Swagger UI
        location /docs {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # API Documentation: ReDoc
        location /redoc {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # API Documentation: OpenAPI Schema
        location /openapi.json {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # ── Provisioner API (sandbox management) ────────────────────────
        # Use a variable so nginx resolves provisioner at request time (not startup).
        # This allows nginx to start even when provisioner container is not running.
        location /api/sandboxes {
            set $provisioner_upstream provisioner:8002;
            proxy_pass http://$provisioner_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Catch-all for /api/ routes not covered above (e.g. /api/threads/{id}/runs).
        # More specific prefix and regex locations above still take precedence.
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }

    # ── TLS termination (opt-in, v7.2 audit Batch 2A) ──────────────────
    # Operators enable TLS by mounting /etc/nginx/certs/tls.crt + tls.key and
    # setting TLS_ENABLED=1 in the container env. The TLS server block lives
    # in a separate file (docker/nginx/nginx.tls.conf) and is appended to this
    # config by the container entrypoint when the cert files exist.
    # Plain-HTTP on 2026 keeps working for local dev.
    #
    # Enable TLS:
    #   1. Provision cert via Let's Encrypt / your CA → ./certs/tls.crt + tls.key
    #   2. In docker-compose.yaml under nginx add:
    #        volumes:
    #          - ./certs:/etc/nginx/certs:ro
    #        environment:
    #          - TLS_ENABLED=1
    #   3. Restart. HTTP on 2026 stays as fallback; TLS on 443 terminates here.
    #    include /etc/nginx/nginx.tls.conf;  # appended by entrypoint when TLS_ENABLED=1
}