events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Response compression ──────────────────────────────────────────────
    # Was entirely unconfigured (nginx defaults gzip off), so every JS/CSS/
    # HTML/JSON response — including uncompressed Next.js dev bundles — went
    # over the Cloudflare tunnel byte-for-byte. SSE streams are naturally
    # excluded (text/event-stream isn't in gzip_types, and proxy_buffering is
    # off for those locations anyway, so streaming latency is unaffected).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/xml+rss application/wasm
        image/svg+xml font/woff2;

    # ── Global upload limit (override per-location as needed) ────────────
    # 25 MB matches typical LangGraph SSE payloads; the uploads location
    # below bumps it to 100 MB for file attachments.
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # ── Real visitor IP (Cloudflare tunnel) ──────────────────────────────
    # Behind the Cloudflare tunnel, nginx's TCP peer is the local cloudflared
    # process arriving via the docker bridge gateway (192.168.200.1) or
    # loopback — NOT the visitor. Cloudflare sets CF-Connecting-IP at its edge
    # and preserves it through the tunnel (verified: reflects real client IP +
    # CF-IPCountry). Trust ONLY the tunnel's local ingress paths so a direct
    # LAN hit to :2026 cannot spoof the header; then $remote_addr becomes the
    # true visitor IP for both logging AND the rate-limit zones below.
    set_real_ip_from 192.168.200.0/24;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # ── Ethical visitor log (first-party, security/abuse-prevention) ──────
    # Structured JSONL, one line per request. Privacy by design:
    #   • $uri only — the query string is dropped, so tokens/secrets that ride
    #     in ?query= are never written to disk.
    #   • No cookies, no request bodies, no auth headers.
    #   • Bounded retention: rotated/pruned to 30 days (scripts/nova-visitors.py
    #     --prune). See docs/VISITOR_LOGGING.md.
    # cf_ray ties a line back to Cloudflare's edge record for correlation.
    log_format visitors escape=json '{'
        '"ts":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"country":"$http_cf_ipcountry",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"host":"$host",'
        '"cf_ray":"$http_cf_ray"'
    '}';

    # Keep the store about real external visitors. The signal for "external"
    # is a Cloudflare ray id: all public traffic traverses CF (which sets it),
    # while internal health probes (127.0.0.1 / bridge) have none. We filter on
    # THAT rather than user-agent — real scanners use curl/python UAs too, and
    # we must not blind the security report to them. Static assets/HMR are
    # dropped as noise so page loads stay legible.
    map $uri $path_is_noise {
        default 0;
        "~^/_next/"     1;
        "~*webpack-hmr" 1;
        "~*\.(?:js|css|map|woff2?|png|jpg|jpeg|svg|ico|gif)$" 1;
    }
    map $http_cf_ray $via_cloudflare {
        default 1;
        ""      0;
    }
    # loggable=1 only when external (via CF) AND not a static asset.
    map "$via_cloudflare$path_is_noise" $loggable {
        default 0;
        "10"    1;
    }


    # ── Service resolution (v7.3 rebrand) ───────────────────────────────
    # v7.3: upstreams are now service names (gateway:8001, frontend:3000).
    # nginx requires a resolver directive when upstreams are referenced
    # via variables (otherwise it returns 502 with "no resolver defined").
    # Use Docker's internal DNS at 127.0.0.11 with a 5s TTL — short enough
    # that a container recreate / IP flip is picked up within 5 seconds.
    # The OS resolver (/etc/hosts + glibc) is NOT used because we want
    # service-discovery semantics, not /etc/hosts staleness.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Rate limiting zones (v7.2 audit, Batch 2A) ────────────────────────
    # Auth endpoints get a strict per-IP limit; the wider API zone covers
    # the rest. Zones are shared across all server blocks below.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;

    # ── Security headers (v7.2 audit, Batch 2A) ──────────────────────────
    # Applied as a reusable map: the more permissive CSP for the app shell,
    # a stricter one for /api/ routes (no scripts/frames needed).
    map $uri $csp_policy {
        # frame-src must allow blob: — the Browser tab / artifact preview
        # renders sandbox HTML through a Blob URL iframe; without it the
        # preview is CSP-blocked and shows a broken-document icon. Blob
        # documents inherit this policy, and agent-generated pages routinely
        # pull Google Fonts, so those two CDNs are allowed explicitly.
        # cloudflareinsights: the Cloudflare tunnel injects its Web Analytics
        # beacon into every HTML response; without the allowance every page
        # logs a CSP violation on nova.alilabsx.com.
        default    "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://cloudflareinsights.com; media-src 'self' blob: data:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
        ~^/api/    "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    }

    # WebSocket upgrade, expressed as a map rather than a literal so the
    # sandbox-proxy locations below can carry Upgrade/Connection without
    # sending a bogus `Connection: upgrade` on their ordinary HTTP requests
    # (the same location serves both the preview HTML and its HMR socket).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # X-Powered-By and Server header hardening (built-in; nginx-extras module
    # would let us strip more, but the base nginx:alpine image only supports
    # server_tokens off and the proxy_set_header X-Powered-By "" pattern.)
    server_tokens off;

    # ── Main server (path-based routing) ─────────────────────────────────
    server {
        listen 2026 default_server;
        listen [::]:2026 default_server;
        server_name _;

        # Persisted structured visitor log (real IPs only, noise filtered).
        # Directory is bind-mounted to the host (../logs) so it survives
        # container recreation — the default /dev/stdout log does not.
        access_log /var/log/nova/access.jsonl visitors if=$loggable;

        # v7.3 (Nova rebrand): upstream → service names (reboot-proof).
        # Previous hardcoded IPs (192.168.200.3:8001 / 192.168.200.2:3000)
        # collided when other containers grabbed the free IPs in the
        # 192.168.200.0/24 subnet. Service names use Docker's internal DNS
        # at 127.0.0.11; nginx re-resolves per request because upstreams
        # are referenced via $variables, so a container recreate / IP flip
        # is picked up automatically. Mirrors the tls block's pattern.
        set $gateway_upstream  gateway:8001;
        # Use container name (deer-flow-frontend) instead of service alias
        # (frontend) so DNS resolves regardless of which compose project
        # owns the container. The service alias is only registered on the
        # network that the compose project created.
        set $frontend_upstream deer-flow-frontend:3000;

        # Default proxy settings for all locations (streaming/SSE support)
        proxy_buffering off;
        proxy_cache off;

        # ── Global security headers (sent on every response) ────────────
        add_header Content-Security-Policy       $csp_policy always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options                "DENY" always;
        add_header X-Content-Type-Options         "nosniff" always;
        add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
        # microphone=(self), not (): `()` disables getUserMedia for the whole
        # app, so Nova's voice mode could never capture audio on any deployment
        # — and only there, since local dev serves no headers at all. `(self)`
        # permits our own origin and still blocks every embedded third party.
        # Camera and geolocation stay fully disabled; nothing needs them.
        add_header Permissions-Policy             "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy     "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
        # `always` ensures the headers are sent even on 4xx/5xx so the browser
        # sees them on error pages too.

        # Keep the unified nginx endpoint same-origin by default. When split
        # frontend/backend or port-forwarded deployments need browser CORS,
        # configure the Gateway allowlist with GATEWAY_CORS_ORIGINS so CORS and
        # CSRF origin checks stay aligned instead of approving every origin at
        # the proxy layer.

        # LangGraph-compatible API routes served by Gateway.
        # Rewrites /api/langgraph/* to /api/* before proxying to Gateway.
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;

            # Headers — X-Forwarded-For is set to the *peer* only (no chain)
            # so the gateway's trusted-proxy logic sees a single hop. Any
            # upstream LB should append X-Real-IP before this nginx.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';

            # SSE/Streaming support
            proxy_set_header X-Accel-Buffering no;

            # Timeouts for long-running requests
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Chunked transfer encoding
            chunked_transfer_encoding on;
        }

        # Custom API: Models endpoint
        location /api/models {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Memory endpoint
        location /api/memory {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: MCP configuration endpoint
        location /api/mcp {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Skills configuration endpoint
        location /api/skills {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Agents endpoint
        location /api/agents {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Custom API: Uploads endpoint (rate-limited; large body allowed)
        location ~ ^/api/threads/[^/]+/uploads {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large file upload support
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_read_timeout 600s;

            # Disable response buffering to avoid permission errors
        }

        # ── Voice session (full-duplex speech) ──────────────────────────
        # Needs its own location for the same reason the sandbox previews do:
        # the generic `location /api/` below sets no Upgrade header, so the
        # WebSocket handshake 400s behind nginx while working perfectly on
        # `make dev`, which bypasses nginx entirely.
        #
        # Long read timeout because a voice session is idle between utterances
        # by design — the default 60s would drop the mic mid-conversation.
        location ~ ^/api/voice/session/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Framed sandbox surfaces (Agent's Computer) ──────────────────
        # These two locations exist for one reason: `add_header` in a
        # location REPLACES the inherited server-level set, and the global
        # set is fatal to anything the browser has to put in an <iframe>.
        #
        # `X-Frame-Options: DENY` blocks the frame outright, and the
        # `~^/api/` CSP above is `default-src 'none'` — which the browser
        # intersects with the gateway's own per-response
        # `Content-Security-Policy: sandbox allow-scripts …`, so even a
        # framed page could not load its own scripts, styles or images.
        # The result was a blank Browser tab on any deployment that runs
        # behind this config, while `make dev` (Next rewrites, no nginx)
        # and nginx.local.conf (no add_header at all) looked fine.
        #
        # Framing is still constrained: the app shell's own CSP allows only
        # `frame-src 'self' blob:`, and the gateway stamps every proxied
        # response with an opaque-origin `sandbox` CSP.
        #
        # Regex locations are matched in source order, so the artifacts
        # block must stay above `location ~ ^/api/threads` below.
        location ~ ^/api/sandbox/(preview|lpreview|absproxy|appview)(-ws)?/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HMR for live dev-server previews, plus ttyd and noVNC, which
            # are proxied through absproxy and are entirely WebSocket-driven.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;

            add_header X-Content-Type-Options "nosniff" always;
        }

        # Non-HTML artifact previews are iframed by the artifact panel.
        # Active content types (text/html, xhtml, svg) are already forced to
        # download by the artifacts router, so dropping XFO/CSP here only
        # unblocks the inert cases (PDF, images).
        # Thread-scoped task-event WebSocket (WS-G): subagent lifecycle events
        # for the Agent's Computer. WebSocket upgrade needs its own location —
        # the generic /api/threads one sets no Upgrade header, and the
        # handshake 400s without it (same reason voice has one above).
        location ~ ^/api/threads/[^/]+/tasks-ws$ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # A task socket idles between subagents by design.
            proxy_read_timeout 3600s;

            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ ^/api/threads/[^/]+/artifacts {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;

            add_header X-Content-Type-Options "nosniff" always;
        }

        # Custom API: Other endpoints under /api/threads. Includes
        # /runs/wait (blocking, sends zero interim bytes — nothing resets
        # nginx's read-timeout clock until the whole run finishes) and
        # /runs/stream (SSE — normally safe since each token resets the
        # clock, but a silent gap between events, e.g. slow sandbox
        # cold-start, is exposed to the same limit). Caught live: an agent
        # run that legitimately ran past nginx's 60s default proxy_read_timeout
        # got killed with a 504 while the backend kept running the turn
        # unaware the client was gone.
        location ~ ^/api/threads {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;

        }

        # Auth endpoints — strict per-IP limit (10 req/min) for login etc.
        # Mitigates credential-stuffing and account-enumeration attacks.
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Documentation: Swagger UI
        location /docs {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # API Documentation: ReDoc
        location /redoc {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # API Documentation: OpenAPI Schema
        location /openapi.json {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Health check endpoint (gateway)
        location /health {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # ── Provisioner API (sandbox management) ────────────────────────
        # Use a variable so nginx resolves provisioner at request time (not startup).
        # This allows nginx to start even when provisioner container is not running.
        location /api/sandboxes {
            set $provisioner_upstream provisioner:8002;
            proxy_pass http://$provisioner_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Catch-all for /api/ routes not covered above (e.g. /api/threads/{id}/runs).
        # More specific prefix and regex locations above still take precedence.
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Catches /api/runs/wait and /api/runs/stream (stateless run
            # endpoints) — same 504-under-nginx's-default-60s risk as
            # /api/threads/*, see the comment on that location.
            proxy_read_timeout 600s;

            # Disable buffering to avoid permission errors when nginx
            # runs as a non-root user (e.g. local development).
        }

        # All other requests go to frontend
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }

    # ── TLS termination (opt-in, v7.2 audit Batch 2A) ──────────────────
    # Operators enable TLS by mounting /etc/nginx/certs/tls.crt + tls.key and
    # setting TLS_ENABLED=1 in the container env. The TLS server block lives
    # in a separate file (docker/nginx/nginx.tls.conf) and is appended to this
    # config by the container entrypoint when the cert files exist.
    # Plain-HTTP on 2026 keeps working for local dev.
    #
    # Enable TLS:
    #   1. Provision cert via Let's Encrypt / your CA → ./certs/tls.crt + tls.key
    #   2. In docker-compose.yaml under nginx add:
    #        volumes:
    #          - ./certs:/etc/nginx/certs:ro
    #        environment:
    #          - TLS_ENABLED=1
    #   3. Restart. HTTP on 2026 stays as fallback; TLS on 443 terminates here.
    #    include /etc/nginx/nginx.tls.conf;  # appended by entrypoint when TLS_ENABLED=1
}