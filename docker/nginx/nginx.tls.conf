# TLS server block — appended to nginx.conf by the container entrypoint
# when TLS_ENABLED=1 and /etc/nginx/certs/tls.crt + tls.key are mounted.
#
# This file mirrors the routing rules in nginx.conf but terminates TLS.
# The HTTP server in nginx.conf keeps handling :2026 as the plaintext
# fallback so the cert can be renewed without downtime.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Reuse the security headers from the HTTP server.
    add_header Content-Security-Policy       $csp_policy always;
    add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options                "DENY" always;
    add_header X-Content-Type-Options         "nosniff" always;
    add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy             "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # HSTS preload: submit the apex domain to https://hstspreload.org after
    # confirming no plain-HTTP subdomains exist.

    set $gateway_upstream gateway:8001;
    set $frontend_upstream frontend:3000;
    proxy_buffering off;
    proxy_cache off;

    # ── Framed sandbox surfaces (Agent's Computer) ──────────────────────
    # See the long comment on the matching blocks in nginx.conf. Short
    # version: `add_header` in a location REPLACES the inherited set, and
    # the server-level `X-Frame-Options: DENY` plus the `~^/api/` CSP
    # (`default-src 'none'`) between them blank out every iframed preview.
    location ~ ^/api/sandbox/(preview|lpreview|absproxy|appview)(-ws)?/ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/api/threads/[^/]+/artifacts {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
