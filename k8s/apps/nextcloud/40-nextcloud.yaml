# Nextcloud application.
#
# Reachability model: Tailscale-only. There is no Ingress and no LoadBalancer
# here on purpose — this k3s runs with `--disable traefik --disable servicelb`,
# so neither exists in the cluster. Instead the Service is a NodePort bound on
# the node, and `tailscale serve` on the host publishes it to the tailnet at
# https://jahanzaib-a520m-ds3h.taile7709d.ts.net with a real Let's Encrypt cert
# issued to the MagicDNS name. Nothing is reachable from the public internet.
#
# Because TLS terminates at tailscaled (not in this pod), Nextcloud has to be
# told the externally-visible scheme and host. Without OVERWRITEPROTOCOL the app
# generates http:// links behind an https:// origin, and browsers block them as
# mixed content — login appears to work, then the web UI silently half-loads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO volume — never two pods holding it at once
  selector:
    matchLabels: { app: nextcloud }
  template:
    metadata:
      labels: { app: nextcloud }
    spec:
      nodeSelector:
        kubernetes.io/hostname: jahanzaib-a520m-ds3h
      securityContext:
        fsGroup: 33          # www-data, so the mounted volume is writable
      initContainers:
        # The Nextcloud installer aborts rather than retries if postgres is not
        # accepting connections on first boot, leaving a half-written config.php
        # that the next start refuses to repair. Gate on the DB being live.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U nextcloud -d nextcloud; do echo "waiting for postgres"; sleep 3; done
      containers:
        - name: nextcloud
          image: nextcloud:stable-apache
          envFrom:
            - secretRef: { name: nextcloud-secrets }
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: REDIS_HOST
              value: redis
            - name: REDIS_HOST_PORT
              value: "6379"
            - name: NEXTCLOUD_ADMIN_USER
              value: admin
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "jahanzaib-a520m-ds3h.taile7709d.ts.net 100.109.249.64 localhost"
            - name: OVERWRITEPROTOCOL
              value: "https"
            - name: OVERWRITEHOST
              value: "jahanzaib-a520m-ds3h.taile7709d.ts.net"
            - name: OVERWRITECLIURL
              value: "https://jahanzaib-a520m-ds3h.taile7709d.ts.net"
            # tailscaled forwards from the node, so the proxy appears to Nextcloud
            # as the pod/node network. Trusting these lets it read X-Forwarded-For
            # instead of logging every login as coming from the cluster CIDR.
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16 100.64.0.0/10 127.0.0.1/32"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          startupProbe:
            # First boot runs the full installer (schema + app bootstrap), which
            # is far slower than steady-state. A generous startup budget stops the
            # liveness probe from killing the pod mid-install and looping forever.
            httpGet: { path: /status.php, port: 80 }
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /status.php, port: 80 }
            periodSeconds: 10
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits:   { memory: 2Gi,   cpu: "2" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  type: NodePort
  selector: { app: nextcloud }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
# Nextcloud's background jobs (file scans, previews, cleanup, notifications).
# Upstream strongly prefers cron over AJAX: without it, maintenance work only
# runs when someone happens to load a page, and large instances drift.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: jahanzaib-a520m-ds3h
          securityContext:
            # occ/cron.php refuse to run as anyone but the owner of
            # config/config.php, which the app image creates as www-data (33).
            # fsGroup alone is not enough — the process UID has to match too, or
            # every run dies with "Console has to be executed with the user that
            # owns the file config/config.php".
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
          containers:
            - name: cron
              image: nextcloud:stable-apache
              command: ["php", "-f", "/var/www/html/cron.php"]
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
              resources:
                requests: { memory: 128Mi, cpu: 50m }
                limits:   { memory: 512Mi, cpu: 500m }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
