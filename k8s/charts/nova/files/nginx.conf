events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Response compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/json
        application/xml application/xml+rss application/wasm
        image/svg+xml font/woff2;

    # ── Global upload limit (override per-location as needed) ────────────
    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # Logging — staging keeps this on stdout (kubectl logs), unlike the
    # Compose deployment's bind-mounted /var/log/nova/access.jsonl visitor
    # log, which would need its own PVC for no staging benefit.
    access_log /dev/stdout;
    error_log /dev/stderr;

    # ── Security headers (ported verbatim from docker/nginx/nginx.conf) ──
    map $uri $csp_policy {
        default    "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://cloudflareinsights.com; media-src 'self' blob: data:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
        ~^/api/    "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    }

    # WebSocket upgrade, expressed as a map rather than a literal so the
    # sandbox-proxy locations below can carry Upgrade/Connection without
    # sending a bogus `Connection: upgrade` on their ordinary HTTP requests
    # (the same location serves both the preview HTML and its HMR socket).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    server_tokens off;

    # ── Rate limiting zones ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/s;
    limit_req_status 429;

    # ── Service resolution (K8s difference from Compose) ─────────────────
    # k3s's CoreDNS ClusterIP — the first address in the default service
    # CIDR (10.43.0.0/16). Verify against `kubectl get svc -n kube-system
    # kube-dns` if the cluster's service CIDR is ever changed from the k3s
    # default. Short names (gateway/frontend/provisioner) resolve because
    # Caught live: nginx's `resolver` directive (needed for the variable-based
    # proxy_pass below, which re-resolves per request instead of caching a
    # single IP at config-load time) does NOT apply /etc/resolv.conf search
    # domains the way glibc's resolver does — it queries CoreDNS with exactly
    # the name given. A bare "gateway" query 502'd with "Host not found";
    # CoreDNS only answers namespace-qualified names. Must use the full
    # Service FQDN here, not the short name Compose-style convenience would
    # suggest.
    resolver 10.43.0.10 valid=5s ipv6=off;

    server {
        listen 2026 default_server;
        server_name _;

        set $gateway_upstream     gateway.{{ .Values.namespace }}.svc.cluster.local:8001;
        set $frontend_upstream    frontend.{{ .Values.namespace }}.svc.cluster.local:3000;
        set $provisioner_upstream provisioner.{{ .Values.namespace }}.svc.cluster.local:8002;

        proxy_buffering off;
        proxy_cache off;

        add_header Content-Security-Policy       $csp_policy always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options                "DENY" always;
        add_header X-Content-Type-Options         "nosniff" always;
        add_header Referrer-Policy                "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy             "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy     "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;

        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        location /api/models {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/memory {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/mcp {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/skills {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/agents {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/threads/[^/]+/uploads {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
        }

        # ── Voice session (full-duplex speech) ──────────────────────────
        # Needs its own location for the same reason the sandbox previews do:
        # the generic `location /api/` below sets no Upgrade header, so the
        # WebSocket handshake 400s behind nginx while working perfectly on
        # `make dev`, which bypasses nginx entirely.
        #
        # Long read timeout because a voice session is idle between utterances
        # by design — the default 60s would drop the mic mid-conversation.
        location ~ ^/api/voice/session/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Framed sandbox surfaces (Agent's Computer) ──────────────────
        # `add_header` in a location REPLACES the inherited server-level
        # set, and the global set is fatal to anything the browser has to
        # put in an <iframe>: `X-Frame-Options: DENY` blocks the frame, and
        # the `~^/api/` CSP is `default-src 'none'`, which the browser
        # intersects with the gateway's own per-response `sandbox …` CSP —
        # so even a framed page could not load its own scripts or styles.
        # Caught live: blank Browser tab on staging while `make dev` (Next
        # rewrites, no nginx) rendered the same app fine.
        # Regex locations match in source order, so the artifacts block must
        # stay above `location ~ ^/api/threads` below.
        location ~ ^/api/sandbox/(preview|lpreview|absproxy|appview)(-ws)?/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Thread-scoped task-event WebSocket (WS-G) — see nginx.conf for rationale.
        location ~ ^/api/threads/[^/]+/tasks-ws$ {
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        add_header X-Content-Type-Options "nosniff" always;
        }


    location ~ ^/api/threads/[^/]+/artifacts {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Includes /runs/wait (blocking, sends zero interim bytes — nothing
        # resets nginx's read-timeout clock until the whole run finishes)
        # and /runs/stream (SSE — normally safe, but a silent gap between
        # events, e.g. slow sandbox cold-start, is exposed to the same
        # limit). Caught live in this staging deployment: a real agent run
        # got killed with a 504 by nginx's 60s default while the backend
        # kept running the turn, unaware the client was gone.
        location ~ ^/api/threads {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/sandboxes {
            proxy_pass http://$provisioner_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Catches /api/runs/wait and /api/runs/stream (stateless run
            # endpoints) — same 504-under-nginx's-default-60s risk as
            # /api/threads/*, see the comment on that location.
            proxy_read_timeout 600s;
        }

        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
