# A real ClusterRoleBinding (not a namespace-pinned RoleBinding, unlike
# rolebinding-namespace-reader.yaml) — see the comment in
# clusterrole-metrics-reader.yaml for why node metrics can't be scoped any
# narrower than this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nova-provisioner-metrics-reader
  labels:
    {{- include "nova.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: nova-provisioner
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: nova-provisioner-metrics-reader
  apiGroup: rbac.authorization.k8s.io
