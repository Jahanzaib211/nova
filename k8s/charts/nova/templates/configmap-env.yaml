apiVersion: v1
kind: ConfigMap
metadata:
  name: nova-env
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
data:
  # DEER_FLOW_ENV=production activates the auth-disabled fail-safe in
  # app/gateway/auth_disabled.py (is_explicit_production_environment()) as
  # defense in depth, independent of the explicit DEER_FLOW_AUTH_DISABLED=0
  # below — belt and suspenders, matching the plan's explicit callout not to
  # rely on the dev-friendly default.
  DEER_FLOW_ENV: "production"
  DEER_FLOW_AUTH_DISABLED: "0"
  DEER_FLOW_PROJECT_ROOT: "/app"
  # Deliberately NOT ".deer-flow" (the Compose deployment's convention) —
  # docker/provisioner/app.py hardcodes its PVC subPath as literally
  # "deer-flow/users/{user_id}/threads/{thread_id}/user-data" (no leading
  # dot). For sandbox Pods to see the same files the gateway writes, the
  # PVC's real top-level directory has to be named to match — see
  # deployment-gateway.yaml's volumeMount for nova-deerflow-data (mounted at
  # a fresh path, with DEER_FLOW_HOME pointing at a "deer-flow" subfolder
  # inside it) and deployment-provisioner.yaml's USERDATA_PVC_NAME. Purely
  # an internal path with no user-facing effect — safe to differ from
  # Compose's convention, verify this alignment explicitly during the
  # "Deploy and verify" pass (a real sandbox pod's file read must see what
  # the gateway wrote).
  DEER_FLOW_HOME: "/app/backend/deerflow-pvc/deer-flow"
  GATEWAY_ENABLE_DOCS: "true"
  # Caught live, the hard way, running 2 gateway replicas: DatabaseConfig
  # ._resolved_sqlite_dir resolves database.sqlite_dir (".deer-flow/data")
  # relative to the process's raw CWD (/app/backend in this image) — NOT
  # relative to DEER_FLOW_HOME, despite DEER_FLOW_HOME governing nearly
  # everything else (channel store, memory, skills). /app/backend is
  # plain container filesystem, not the mounted PVC, so the SQLite
  # database (shared by the checkpointer AND all app data — users,
  # threads, everything) was silently per-pod-ephemeral this whole time:
  # wiped on every restart with 1 replica, and with 2+ replicas each pod
  # gets its own disconnected database (confirmed live: a user registered
  # via one replica came back "user not found" on the other). This env
  # var is the code's own purpose-built override for exactly this — see
  # DatabaseConfig._resolved_sqlite_dir's docstring — a config-only fix,
  # no rebuild needed.
  DEER_FLOW_SQLITE_DIR: "/app/backend/deerflow-pvc/deer-flow/.deer-flow/data"
  # In-cluster Redis Service DNS, no auth configured (staging trust level —
  # see the comment in files/config.yaml's stream_bridge section). Resolved
  # into config.yaml's stream_bridge.redis_url via its $REDIS_URL syntax.
  REDIS_URL: "redis://redis.{{ .Values.namespace }}.svc.cluster.local:6379/0"
