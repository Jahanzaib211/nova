apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
    {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nova.labels" . | nindent 8 }}
        {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 8 }}
    spec:
      enableServiceLinks: false   # avoid legacy {SVCNAME}_PORT-style env collisions; see deployment-gateway.yaml
      securityContext:
        # nginx:alpine's master process needs to start as root to bind the
        # port and spawn workers as its own unprivileged `nginx` user — the
        # cap_add below (matching docker/docker-compose-dev.yaml's already-
        # proven pattern) is what makes that safe instead of running fully
        # privileged.
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # readOnlyRootFilesystem below means /var/cache/nginx is now a fresh
        # emptyDir, not the stock image's pre-created temp-file directories
        # (client_temp/proxy_temp/etc.) — nginx creates the hashed
        # subdirectories *under* each of these on demand, but not the
        # top-level dirs themselves, so they must exist before nginx starts.
        - name: nginx-cache-dirs
          image: {{ .Values.images.nginx }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /var/cache/nginx/client_temp /var/cache/nginx/proxy_temp /var/cache/nginx/fastcgi_temp /var/cache/nginx/uwsgi_temp /var/cache/nginx/scgi_temp"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
          volumeMounts:
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2026
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            # nginx.conf sets `pid /tmp/nginx.pid;` (files/nginx.conf).
            - name: tmp
              mountPath: /tmp
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: {{ .Values.resources.nginx.requests.cpu }}
              memory: {{ .Values.resources.nginx.requests.memory }}
            limits:
              cpu: {{ .Values.resources.nginx.limits.cpu }}
              memory: {{ .Values.resources.nginx.limits.memory }}
          livenessProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 2026
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 2026
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nova-nginx-config
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: var-cache-nginx
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 4 }}
  ports:
    - port: 2026
      targetPort: 2026
      nodePort: {{ .Values.nodePort }}
