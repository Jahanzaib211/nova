apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
    {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nova.labels" . | nindent 8 }}
        {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 8 }}
    spec:
      enableServiceLinks: false   # avoid legacy {SVCNAME}_PORT-style env collisions; see deployment-gateway.yaml
      securityContext:
        # nginx:alpine's master process needs to start as root to bind the
        # port and spawn workers as its own unprivileged `nginx` user — the
        # cap_add below (matching docker/docker-compose-dev.yaml's already-
        # proven pattern) is what makes that safe instead of running fully
        # privileged.
        runAsNonRoot: false
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2026
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.resources.nginx.requests.cpu }}
              memory: {{ .Values.resources.nginx.requests.memory }}
            limits:
              cpu: {{ .Values.resources.nginx.limits.cpu }}
              memory: {{ .Values.resources.nginx.limits.memory }}
          livenessProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 2026
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/auth/setup-status
              port: 2026
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nova-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 4 }}
  ports:
    - port: 2026
      targetPort: 2026
      nodePort: {{ .Values.nodePort }}
