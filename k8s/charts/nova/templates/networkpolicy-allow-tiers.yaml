# k3s enforces these via an embedded kube-router controller by default —
# see the correction note in networkpolicy-default-deny.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {}   # NodePort traffic arrives pre-DNAT'd from outside the pod network; allow all
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Name predates the "channels" source being added (Phase 2) — kept
  # as-is to avoid a spurious resource replace on upgrade; the ingress
  # rule below is the source of truth, not the name.
  name: allow-gateway-from-nginx-and-provisioner
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "gateway") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 14 }}
        # channels (deployment-channels.yaml) talks to Gateway over HTTP
        # via langgraph-sdk to create/stream runs on behalf of IM users.
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "channels") | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-nginx
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-provisioner-from-nginx-and-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "provisioner") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "nginx") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "gateway") | nindent 14 }}
---
# Both gateway (stream bridge, cancel signal, distributed lock, rate
# limiter) and channels (runs the identical app code, same middleware
# stack) construct a Redis client at startup when stream_bridge.type=redis
# — both need ingress access here, not just gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-gateway-and-channels
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "redis") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "channels") | nindent 14 }}
---
# Sandbox pods are created dynamically by the provisioner (not templated by
# this chart, so app.kubernetes.io/name isn't set on them) — matched by the
# raw "app: deer-flow-sandbox" label the provisioner itself assigns
# (docker/provisioner/app.py _build_pod/_build_service). Caught live: this
# rule was originally missing entirely, silently blocking every gateway ->
# sandbox connection (NodePort, ClusterIP, and direct pod IP alike) while
# leaving host-originated traffic like kubelet's readiness probes unaffected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sandbox-from-gateway-and-provisioner
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: deer-flow-sandbox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "provisioner") | nindent 14 }}
---
# Without this, searxng is covered by default-deny-ingress (podSelector: {})
# and the gateway cannot reach it — while the pod stays Ready, because kubelet's
# probes are host-originated and unaffected by policy. That is the exact trap
# documented in networkpolicy-default-deny.yaml's correction note, which cost a
# debugging cycle on the sandbox pods: healthy, Ready, and unreachable.
#
# Failing this way is especially quiet here: web_search falls back to
# DuckDuckGo, so a blocked SearXNG looks like working search.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-searxng-from-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nova.selectorLabels" (dict "component" "searxng") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nova.selectorLabels" (dict "component" "gateway") | nindent 14 }}
