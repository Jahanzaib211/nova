# Backs backend/.deer-flow (SQLite DB + WAL, per-user memory.json, per-user
# thread workspaces/uploads/outputs). ReadWriteOnce is correct here because
# it's node-scoped, not pod-scoped: gateway (now 2 replicas, Phase 2),
# channels, and this file's own backup CronJob (Phase 7) all mount it
# concurrently today, which works precisely because every pod in this
# single-node cluster lands on the same node RWO is scoped to. A real
# second node would need this to become ReadWriteMany instead.
#
# Uses a STATIC PV with an explicit hostPath rather than the dynamic
# `local-path` StorageClass: the provisioner creates sandbox Pods that need
# to see the SAME thread files the gateway writes (uploads, workspace,
# outputs) — dynamic provisioning picks an unpredictable host path per PVC,
# which would make that alignment fragile to get right and hard to verify.
# Pinning it here means THREADS_HOST_PATH on the provisioner Deployment can
# point at the exact same directory with confidence, not a guess.
apiVersion: v1
kind: PersistentVolume
metadata:
  # PVs are cluster-scoped and PVC.spec.volumeName is immutable once bound
  # — deerflowDataPVName defaults to the original literal name so the
  # live release's existing binding never changes on upgrade. A second
  # release into a different namespace (e.g. a Phase 7 DR-drill install)
  # overrides both this and deerflowDataHostPath to avoid colliding with
  # the live PV or reusing its data.
  name: {{ .Values.deerflowDataPVName }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nova-deerflow-data-manual
  hostPath:
    path: {{ .Values.deerflowDataHostPath }}
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nova-deerflow-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nova-deerflow-data-manual
  volumeName: {{ .Values.deerflowDataPVName }}
  resources:
    requests:
      storage: 5Gi
