apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-staging-namespace-reader
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nova.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: nova-provisioner
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: nova-staging-namespace-reader
  apiGroup: rbac.authorization.k8s.io
