# Generic defaults. Environment-specific overrides (namespace, nodePort,
# image tags, sizing) live in values-staging.yaml — pass both at install
# time: `helm install nova ./nova -f values-staging.yaml`.

namespace: nova-staging

images:
  gateway: nova-gateway:staging
  frontend: nova-frontend:staging
  nginx: nginx:alpine
  provisioner: nova-provisioner:staging      # the provisioner service's own image (docker/provisioner/Dockerfile)
  sandbox: nova-sandbox-android:latest       # SANDBOX_IMAGE — the image used for the sandbox PODS the provisioner creates
  redis: redis:7-alpine                      # public image, pulled directly — no local build/import step needed

imagePullPolicy: IfNotPresent

nodePort: 30026

skillsHostPath: ""   # set in values-staging.yaml to the repo's skills/custom absolute path

resources:
  nginx:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  frontend:
    replicas: 2
    maxReplicas: 4   # HPA ceiling — see resourcequota.yaml, this + gateway's ceiling both fit under the 3Gi/3-core quota
    requests: { cpu: 100m, memory: 200Mi }
    limits: { cpu: 500m, memory: 512Mi }
  gateway:
    # Phase 2: replicas raised from a hard 1 to 2 now that the Redis stream
    # bridge, cross-replica cancel signal, distributed create_or_reject
    # lock, and Redis-backed rate limiter are all wired in — see
    # k8s/ARCHITECTURE.md §4/§10 for exactly what was blocking this before.
    replicas: 2
    maxReplicas: 4   # HPA ceiling — same headroom note as frontend above
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: 1500m, memory: 1536Mi }
  provisioner:
    # Bumped for the /api/infra/* dashboard surface (pod/deployment/event
    # listing + log tailing) added alongside the sandbox lifecycle API.
    # Headroom, not a fix for an observed problem — live usage before this
    # change was ~1m CPU / 78Mi memory (`kubectl top`).
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  redis:
    # Coordination state, not the system of record — modest sizing.
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
    storage: 512Mi
  channels:
    # Same image as gateway but not serving HTTP traffic — lighter than a
    # gateway replica.
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

resourceQuota:
  # Bumped alongside the gateway replicas:1->2 change and the two new
  # workloads (redis, channels) — the box has 30GB RAM total and this is
  # still a protective ceiling relative to other real tenants on it (e.g.
  # gvm alone runs ~6GB), not a loosened backstop.
  requestsCpu: "3"
  requestsMemory: 3Gi
  limitsMemory: 8Gi
