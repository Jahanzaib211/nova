# Source: this same repo, main branch. Flux polls it and reconciles
# whatever's under k8s/charts/nova whenever main changes — the actual
# GitOps loop. 1m interval: staging wants fast feedback on a config push,
# not the slower interval you'd use once this graduates to production.
#
# The repo is private, and SSH (not HTTPS) is the only auth `flux
# bootstrap github` sets up — it provisions one deploy key + secret
# (flux-system/flux-system, SSH identity) scoped to this repo. Reusing
# that secretRef here rather than inventing a second credential: a
# GitHub deploy key is already scoped to exactly one repo, so there's no
# broader access to gain by sharing it across GitRepository sources that
# both point at this same repo.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nova
  namespace: flux-system
spec:
  interval: 1m
  # Caught live: the 60s default clone timeout is marginal on this box —
  # real, ongoing CPU contention from other processes (load average
  # regularly 2.5+) makes an SSH clone (ECDSA key exchange is CPU-bound)
  # intermittently exceed 60s even though the connection itself is fine
  # (confirmed: raw TCP to github.com:22 always connects instantly).
  # 180s gives real headroom without masking an actual outage — a clone
  # that takes 3 real minutes is worth investigating on its own.
  timeout: 180s
  url: ssh://git@github.com/Jahanzaib211/nova
  secretRef:
    name: flux-system
  ref:
    branch: main
