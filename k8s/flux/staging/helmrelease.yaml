# Reconciles k8s/charts/nova against the nova-staging namespace on every
# GitRepository sync — this IS the GitOps loop: push a change to
# values-staging.yaml's content below (or to any chart template), Flux
# applies it within one interval, no manual `helm upgrade` needed.
#
# sourceRef points at the flux-system GitRepository (bootstrap's own
# self-referencing source for this same repo) rather than a separate
# GitRepository object. A second GitRepository pointing at the identical
# url+ref+secretRef was tried first; the real cause of that one's
# repeated timeouts turned out to be this repo's real size (~19MB,
# 2000+ objects, grown substantially this session) against this box's
# genuinely variable bandwidth to GitHub (measured directly:
# ~3 MiB/s dropping to ~150 KiB/s mid-clone on the same transfer) — see
# flux-system/gotk-sync.yaml's timeout comment for the actual
# measurement. Whether two sources against the same URL independently
# contend for anything inside source-controller was never conclusively
# isolated. Removing the duplicate stands on its own merits regardless
# — there was no reason to have two sources for one repo either way.
#
# Secrets (nova-secrets) are deliberately NOT managed here — bootstrap-secrets.sh
# keeps creating them directly via kubectl, exactly as before. This
# HelmRelease references the Secret by name only (via the chart's own
# templates), never templates a secret value into a manifest Flux would
# commit-track — see k8s/README.md and k8s/ARCHITECTURE.md §3.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nova
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: nova-staging
  releaseName: nova
  chart:
    spec:
      chart: k8s/charts/nova
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  # Generated directly from k8s/charts/nova/values-staging.yaml by
  # kustomization.yaml's configMapGenerator — not a hand-copied block.
  # See that file's comment for why: a hand-copied version of this
  # drifted out of sync and caused a real incident.
  valuesFrom:
    - kind: ConfigMap
      name: nova-values-staging
      valuesKey: values-staging.yaml
  # A bad chart push shouldn't wedge the release — remediate automatically
  # rather than leaving nova-staging in a half-upgraded state.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
